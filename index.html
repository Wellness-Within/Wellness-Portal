<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellness From Within Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="https://dawnspain.com/wp-content/uploads/2026/11/wellness-from-within-site-icon-300x300.png">
<link rel="apple-touch-icon" href="https://dawnspain.com/wp-content/uploads/2026/11/wellness-from-within-site-icon-300x300.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet apothecary ledger. Sticky header, then a two-pane workspace (list | record) that stacks on phones.
   Look matches dawnspain.com: ivory paper, deep sea-ink text, teal accents, aqua tints, Georgia headings, Manrope body. */
:root{
  --bg:#F8F6EF; --surface:#FFFEFA; --sunk:#F1EEE5; --ink:#28454C; --muted:#5E777D; --line:#DCE2E3;
  --accent:#087C9C; --accent-ink:#FFFFFF; --soft:#DEF1F2; --brand:#F8F6EF; --brand-ink:#28454C; --amber:#2D5A9E; --amber-soft:#E2ECFA; --ok:#087C9C; --ok-soft:#DEF1F2; --danger:#A3312B;
  --sand:#E9E1D3;
  --f-display:Georgia, "Times New Roman", serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A191C; --surface:#11262A; --sunk:#0D1F23; --ink:#E0F2F4; --muted:#93B2B7; --line:#21414A;
  --accent:#75E3EB; --accent-ink:#06262B; --soft:#173A40; --brand:#0D1F23; --brand-ink:#E0F2F4; --amber:#A9C6F5; --amber-soft:#1A2A44; --ok:#75E3EB; --ok-soft:#173A40; --danger:#F08C84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A191C; --surface:#11262A; --sunk:#0D1F23; --ink:#E0F2F4; --muted:#93B2B7; --line:#21414A;
  --accent:#75E3EB; --accent-ink:#06262B; --soft:#173A40; --brand:#0D1F23; --brand-ink:#E0F2F4; --amber:#A9C6F5; --amber-soft:#1A2A44; --ok:#75E3EB; --ok-soft:#173A40; --danger:#F08C84; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);border-bottom:1px solid var(--line)}
header.top nav.tabs button{color:var(--brand-ink)}header.top nav.tabs button{opacity:.8}header.top nav.tabs button[aria-current="true"]{opacity:1}header.top #signout{color:var(--accent)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:inherit;text-decoration:none}
.brand-mark{width:40px;height:40px;flex:none;background:url("https://dawnspain.com/wp-content/uploads/2026/11/wellness-from-within-site-icon-300x300.png") center/contain no-repeat}
.brand-name{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:-.5px}
.brand-name span{font-size:10px;text-transform:uppercase;letter-spacing:.19em;color:var(--muted);margin-top:4px}
nav.tabs{display:flex;gap:2px 14px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;border-bottom:1.5px solid transparent;padding:7px 2px;border-radius:0;color:var(--muted);font:500 14px var(--f-body);cursor:pointer}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{background:none;color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}a:hover{color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:min(78%,560px);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--soft);border-color:transparent;border-bottom-right-radius:3px}
.msg.theirs{align-self:flex-start;border-bottom-left-radius:3px}
.msg-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
/* Side-menu layout (from the dashboard mock-up) on wide screens; top bar on phones */
nav.tabs .ico{flex:none;width:18px;height:18px}
nav.tabs button{display:inline-flex;align-items:center;gap:7px}
.side-help{display:none}
@media (min-width:900px){
  body.side{display:flex;align-items:flex-start}
  body.side header.top{position:sticky;top:0;height:100vh;width:250px;flex:none;border-bottom:0;border-right:1px solid var(--line);background:var(--soft);overflow-y:auto}
  body.side header.top .wrap{flex-direction:column;align-items:stretch;flex-wrap:nowrap;min-height:100%;padding:28px 16px 20px;gap:24px;max-width:none;margin:0}
  body.side .brand{margin-right:0;padding:0 6px}
  body.side nav.tabs{flex-direction:column;gap:4px}
  body.side nav.tabs button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:var(--r);font:600 14.5px var(--f-body);text-align:left;opacity:1;color:var(--ink)}
  body.side nav.tabs button:hover{background:color-mix(in srgb, var(--surface) 55%, transparent)}
  body.side nav.tabs button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(40,69,76,.08)}
  body.side .side-help{display:flex;flex-direction:column;gap:2px;margin-top:auto;background:var(--surface);border-radius:12px;padding:14px 16px;font-size:13px}
  body.side .side-help b{font-size:14px}
  body.side #signout{align-self:flex-start;padding-left:6px;margin-top:auto}
  body.side .side-help + #signout{margin-top:0}
  body.side .help-sheet{display:none}
  body.side main.wrap{flex:1 1 auto;min-width:0;max-width:1240px;padding:40px clamp(18px,4vw,56px) 56px;margin:0}
}
/* Client home dashboard */
.dash-hello h1{font-size:36px;line-height:1.15}
.dash-banner{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.dash-ico{width:44px;height:44px;border-radius:12px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;flex:none}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.dash-card .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dash-card .head a,.dash-card .head button.ghost{font-size:14px;font-weight:600}
.date-tile{width:72px;height:76px;flex:none;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.date-tile span{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}.date-tile b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.num-dot{width:32px;height:32px;flex:none;border-radius:50%;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.prog-chart{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.prog-chart figcaption{margin-bottom:4px}.prog-chart svg{width:100%;height:auto;display:block;margin-top:6px}
.prog-chart .grid{stroke:var(--line);stroke-width:1}.prog-chart .ax{font-size:11px;fill:var(--muted)}.prog-chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.prog-chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}.prog-chart .hit{fill:transparent}.prog-chart .pt:hover .dot{r:8}
.prog-up{color:#2f7d4f}.prog-down{color:#a8562a}.dash-wide{grid-column:1/-1}.prog-row{gap:10px}.prog-row>span:first-child{flex:1;min-width:0}.spark{flex:none}.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}.spark .dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.dash-link{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;font:inherit;color:inherit;cursor:pointer;text-align:left}.dash-link:hover b{color:var(--accent)}.dash-link:last-child{border-bottom:0}
.sched-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.inv-tab{width:100%;border-collapse:collapse;font-size:14px}.inv-tab th,.inv-tab td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.inv-tab th{font-weight:600;color:var(--muted);font-size:12px}.inv-tab .num{text-align:right;white-space:nowrap}.inv-tab tfoot td{border:0;padding:3px 4px}
.inv-line{display:grid;grid-template-columns:minmax(100px,1fr) minmax(130px,2fr) minmax(100px,1.1fr) minmax(100px,1fr) 60px 88px auto auto;gap:6px;align-items:center}
@media (max-width:760px){.inv-line{grid-template-columns:1fr 1fr}.inv-line .li-desc{grid-column:1/-1}}
.dash-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.dash-row:last-child{border-bottom:0}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.count{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.dot{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
button,.btn{font:600 14px var(--f-body);border-radius:3px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{background:#066A86;border-color:#066A86}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{background:#75E3EB;color:#06262B}}
button.ghost{border-color:transparent;background:none;color:var(--accent);padding:6px 8px}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:72px;resize:vertical}
[hidden]{display:none!important}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.acc{background:var(--soft);color:var(--accent)}
.panes{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.panes>*{min-width:0}
@media (max-width:820px){.panes{grid-template-columns:1fr}.panes.has-sel>.list-pane{display:none}.panes:not(.has-sel)>.detail-pane{display:none}}
@media (min-width:821px){.back-btn{display:none}}
.list-pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list-pane .head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.list{max-height:68vh;overflow:auto}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:11px 12px;font-weight:400}
.item:hover{background:var(--sunk)} .item[aria-current="true"]{background:var(--soft)}
.item b{display:block;font-weight:600}
.item .meta{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.subtabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--muted)}
.subtabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-family:var(--f-display);font-size:17px;padding:0;margin-bottom:8px}
.formsec{padding-block:14px;border-top:1px solid var(--line)} .formsec:first-child{border-top:0;padding-top:0}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale label{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale input:checked+span{color:var(--accent-ink)} .scale label:has(input:checked){background:var(--accent);border-color:var(--accent)}
.scale label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:14px;background:var(--surface)}
.choices input{position:absolute;opacity:0;width:1px;height:1px}
.choices label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.choices label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.req{color:var(--danger);font-weight:600}
.photo{width:132px;height:132px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk)}
.empty-photo{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:none;flex:1 1 180px}
.seg button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hist{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg)}
.hist summary{cursor:pointer;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start} .check input{width:auto;margin-top:4px}
.bottle{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bottle-head{display:flex;gap:10px;align-items:center}
.bottle-num{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 12px;background:var(--sunk);border-radius:8px}
.legend code{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.proto{display:flex;flex-direction:column;gap:10px}
.scan-bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
.scanview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.scan-pane{max-height:calc(100dvh - 190px);overflow:auto;overscroll-behavior:contain}
.scan-pane.right{display:flex;flex-direction:column;gap:16px}
.scan-form .field textarea{min-height:90px}
.scan-h{font-size:15px;margin:10px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--accent)}
.scan-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
.scan-row{display:grid;grid-template-columns:var(--tpl);gap:10px}
.scan-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px}
@media (max-width:960px){.scanview{grid-template-columns:1fr}.scan-pane{max-height:none;overflow:visible}.scan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.scan-grid,.scan-row{grid-template-columns:1fr}.scan-row:has(>.check){grid-template-columns:1fr auto}.scan-row:has(>.check)>.field:not(:first-child){grid-column:1/-1}}
.pline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pline .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:2px;min-width:64px}
.pline .x{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.ptext{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.ptext.rx{font-family:var(--f-mono);font-size:13.5px}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px}
.target{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:13.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:8px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.notice.ok{background:var(--ok-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.code{font-family:var(--f-mono);white-space:nowrap;color:var(--accent)}
details.poly{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 14px}
details.poly summary{cursor:pointer;font-weight:600}
.planview{display:flex;flex-direction:column;gap:14px}
.planview .rx{font-family:var(--f-mono);font-size:14px}
.freq{font-weight:600}
.contact{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13.5px}
.contact span{user-select:all}
.rep-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:20px;align-items:start}
.rep-layout>*{min-width:0}
@media (max-width:980px){.rep-layout{grid-template-columns:1fr}}
.case-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.case-pane{position:static}}
.case-sheet{padding:16px}
.rubrics{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rubric{border-bottom:1px solid var(--line)}
.rubric:last-child{border-bottom:0}
.rubric-row{display:flex;gap:8px;align-items:center;padding:4px 8px 4px 4px}
.rubric-path{flex:1 1 auto;min-width:0;text-align:left;border:0;background:none;font-weight:400;padding:7px 8px;border-radius:6px;overflow-wrap:anywhere}
.rubric-path:hover{background:var(--sunk)}
.rubric-path b{font-weight:600;color:var(--accent)}

/* Frequency shorthand used in the protocols, in plain words for clients */
function plainFreq(f){
  const s = String(f||"").trim(); if(!s) return "";
  const t = s.replace(/\s+/g,"");
  const words = {1:"once",2:"twice",3:"3 times",4:"4 times",5:"5 times",6:"6 times"};
  let m;
  if((m=t.match(/^(\d)D$/i))) return (words[m[1]]||m[1]+" times")+" a day";
  if(/^eOD$/i.test(t)) return "every other day";
  if(/^eOtherNight$/i.test(t)) return "every other night";
  if((m=t.match(/^e(\d+)H$/i))) return m[1]==="1" ? "every hour" : `every ${m[1]} hours`;
  if((m=t.match(/^e(\d+)D$/i))) return `every ${m[1]} days`;
  if((m=t.match(/^e(\d+)(min|m)$/i))) return `every ${m[1]} minutes`;
  if((m=t.match(/^e(\d+)W$/i))) return m[1]==="1" ? "every week" : `every ${m[1]} weeks`;
  if(/^1W$/i.test(t)) return "once a week";
  if(/^SOS$/i.test(t)) return "as needed";
  return "";
}

/* Photo: resized in the browser and kept in the client's own private record */
function resizePhoto(file){
  return new Promise((res, rej) => {
    if(!file || !/^image\//.test(file.type)) return rej(new Error("type"));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .85, out = c.toDataURL("image/jpeg", q);
      while(out.length > 220000 && q > .4){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("read")); };
    img.src = url;
  });
}

/* ---------- Supabase data layer: a small document store on one "docs" table ---------- */
const SB = window.supabase.createClient(WFW_CONFIG.supabaseUrl, WFW_CONFIG.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
const parentOf = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";
const idOf = p => p.slice(p.lastIndexOf("/") + 1);
const genId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 20) : Math.random().toString(36).slice(2) + Date.now().toString(36));
function sbErr(error){ const e = new Error(error?.message || "database error"); e.code = /row-level security|permission|violates/i.test(error?.message || "") ? "invalid_argument" : (error?.code || "error"); return e; }
function docSnap(path, row){ return { id: idOf(path), exists: !!row, data: () => row ? row.data : undefined }; }

/* live listeners: one realtime channel, refetch whatever a change touches */
const LIVE = { docs: new Map(), cols: new Map(), channel: null, timer: null, dirty: new Set() };
function liveStart(){
  if(LIVE.channel) return;
  LIVE.channel = SB.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, ev => {
    const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); if(!p) return;
    LIVE.dirty.add(p); clearTimeout(LIVE.timer); LIVE.timer = setTimeout(liveFlush, 120);
  }).subscribe();
}
function liveFlush(){
  const paths = [...LIVE.dirty]; LIVE.dirty.clear();
  const docs = new Set(), cols = new Set();
  paths.forEach(p => { if(LIVE.docs.has(p)) docs.add(p); const par = parentOf(p); if(LIVE.cols.has(par)) cols.add(par); });
  docs.forEach(p => fetchDoc(p).then(s => LIVE.docs.get(p)?.forEach(l => l.cb(s))).catch(e => LIVE.docs.get(p)?.forEach(l => l.err && l.err(e))));
  cols.forEach(c => fetchCol(c).then(s => LIVE.cols.get(c)?.forEach(l => l.cb(s))).catch(e => LIVE.cols.get(c)?.forEach(l => l.err && l.err(e))));
}
async function fetchDoc(path){
  const { data, error } = await SB.from("docs").select("data").eq("path", path).maybeSingle();
  if(error) throw sbErr(error); return docSnap(path, data);
}
async function fetchCol(col){
  const out = []; let from = 0;
  for(;;){ const { data, error } = await SB.from("docs").select("path,data").eq("parent", col).range(from, from + 999); if(error) throw sbErr(error);
    out.push(...data); if(data.length < 1000) break; from += 1000; }
  return { docs: out.map(r => ({ id: idOf(r.path), data: () => r.data })), size: out.length };
}
function listen(map, key, fetcher, cb, err){
  liveStart(); const l = { cb, err }; if(!map.has(key)) map.set(key, new Set()); map.get(key).add(l);
  fetcher(key).then(cb).catch(e => err && err(e));
  return () => map.get(key)?.delete(l);
}
function makeDoc(path){
  return {
    id: idOf(path), path,
    get: () => fetchDoc(path),
    set: async (data) => { const { error } = await SB.from("docs").upsert({ path, parent: parentOf(path), id: idOf(path), data, updated_at: new Date().toISOString() }); if(error) throw sbErr(error); },
    update: async (data) => { const { error } = await SB.rpc("doc_merge", { p_path: path, p_data: data }); if(error) throw sbErr(error); },

/* ---------- billing: invoices/<id> = {clientId, number, date, due, items:[{kind,desc,qty,price,sessions,credit}], discount:{label,type,value}, status:"draft"|"sent"|"void", payments:[{id,date,amount,method,note}], note, pay:{...}, apptId} ---------- */

async function nextInvNumber(){
  const used=Object.values(S.inv||{}).map(v=>+v.number||0); const n=Math.max(+billSet().nextNo||1001, used.length?Math.max(...used)+1:0);
  try{ await S.db.doc("settings/practice").update({billing:{...billSet(), nextNo:n+1}}); }catch(e){ console.warn(e); }
  return n;
}
async function saveInvoice(mode){
  readInvForm(); const ed=S.invEdit, v={...ed.v};
  v.items=v.items.filter(i=>i.desc || +i.price || i.credit); if(!v.items.length){ toast("Add at least one item"); return; }
  if(v.items.some(i=>i.kind==="package" && !(i.sessions>0))){ toast("Enter how many sessions the package includes"); return; }
  if(!v.number) v.number=await nextInvNumber();
  if(mode!=="draft" && v.status!=="sent"){ v.status="sent"; v.sentAt=new Date().toISOString(); }
  if(v.status==="sent") v.pay=payInfo();
  v.updatedAt=new Date().toISOString(); if(!v.createdAt) v.createdAt=v.updatedAt;
  const {id:_x, ...data}=v;
  try{ await S.db.doc("invoices/"+ed.id).set(data); }catch(e){ console.warn(e); toast("That didn't save. Please try again."); return; }
  S.inv={...S.inv, [ed.id]:data}; S.invEdit=null; S.invConfirm=null; S.invOpenId=ed.id;
  toast(mode==="draft"?"Draft saved":ed.v.status==="sent"?"Invoice updated":"Invoice sent to their portal");
  if(mode==="sendmail") await invEmail(data.clientId, data, ed.id);
  renderClients();
}

  if(act==="liadddisc"){ readInvForm(); S.invEdit.v.items.push({kind:"discount",desc:"Discount",qty:1,price:0}); renderClients(); const ls=document.querySelectorAll("#inv-form [data-li]"); const last=ls[ls.length-1]; last?.querySelector(".li-desc")?.select(); return true; }
  if(act==="invsave"){ a.disabled=true; await saveInvoice(a.dataset.mode); a.disabled=false; return true; }
  if(act==="invaskvoid"){ readInvForm(); S.invConfirm="void"; renderClients(); return true; }
  if(act==="invaskdel"){ readInvForm(); S.invConfirm="del"; renderClients(); return true; }
  if(act==="invvoid"){ const ed=S.invEdit; const data={...S.inv[ed.id], status:"void", voidedAt:new Date().toISOString()};

/* ---------- progress: ratings from forms (intake, Qest4 pre-scan, follow-ups) + Dawn's notes at clients/<id>/progress/<pid> ---------- */
const PROG_MEASURES = [
  {k:"well",   label:"Overall wellbeing", hint:"higher is better"},
  {k:"main",   label:"Main concern",   hint:"lower is better", low:true},
  {k:"c2",     label:"Second concern", hint:"lower is better", low:true},
  {k:"c3",     label:"Third concern",  hint:"lower is better", low:true},
  {k:"energy", label:"Energy",         hint:"higher is better"},
  {k:"sleep",  label:"Sleep",          hint:"higher is better"},
  {k:"mood",   label:"Mood",           hint:"higher is better"},
  {k:"stress", label:"Stress",         hint:"lower is better", low:true},
  {k:"dawn",   label:"Dawn's progress rating", hint:"higher is better"},
];
const OVERALL_SCORE = {"Much better":5,"A little better":4,"About the same":3,"A little worse":2,"Much worse":1};
const n10 = v => { const n=+v; return n>=1&&n<=10 ? n : null; };
/* one entry per form or note: {date, src, vals:{k:n}, texts:{k:"concern text"}, overall, note} */
function progressEntries(c, qhist, notes, forClient){
  const out=[]; c=c||{};
  if(c.intakeSubmittedAt && c.intake){ const f=c.intake; const v={main:n10(f.concern1Sev), stress:n10(f.stressLevel)};
    out.push({date:c.intakeSubmittedAt, src:"Homeopathy intake", vals:v, texts:{main:f.concern1||f.mainConcern||""}}); }
  const qs=(qhist||[]).slice(); if(!qs.length && c.qestSubmittedAt && c.qest) qs.push({form:c.qest, submittedAt:c.qestSubmittedAt});
  qs.forEach(h=>{ const f=h.form||{}; out.push({date:h.submittedAt, src:"Qest4 pre-scan form",
    vals:{well:n10(f.wellbeing), energy:n10(f.energy), sleep:n10(f.sleep), mood:n10(f.mood), stress:n10(f.stress)}, note:f.sinceLast||""}); });
  (c.followupHistory||[]).forEach(h=>{ const f=h.form||{}; out.push({date:h.submittedAt, src:"Follow-up",
    vals:{main:n10(f.mainNow), energy:n10(f.energy), sleep:n10(f.sleep), mood:n10(f.mood), stress:n10(f.stress)}, overall:f.overall||"", note:f.changes||""}); });
  (notes||[]).filter(p=>!forClient||p.shared).forEach(p=>out.push({date:p.date||p.at, src:"Dawn's note", vals:{dawn:n10(p.rating)}, note:p.note||"", id:p.id, shared:!!p.shared}));
  return out.filter(e=>e.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function progChart(m, pts){
  // single series, 1–10 scale; pts: [{date, v, text}]
  const W=320, H=150, L=26, R=10, T=12, B=26, iw=W-L-R, ih=H-T-B;
  const t=pts.map(p=>Date.parse(String(p.date).slice(0,10)+"T12:00:00")); const t0=Math.min(...t), t1=Math.max(...t);
  const x=i=> pts.length===1 ? L+iw/2 : L+(t1===t0 ? i/(pts.length-1) : (t[i]-t0)/(t1-t0))*iw;
  const y=v=> T+ih-(v-1)/9*ih;
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const first=pts[0], last=pts[pts.length-1], d=last.v-first.v;
  const better = pts.length>1 && d!==0 ? (m.low ? d<0 : d>0) : null;
  const fmt=s=>new Date(String(s).slice(0,10)+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<figure class="prog-chart">
    <figcaption><b>${esc(m.label)}</b> <span class="small muted">${esc(m.hint)}</span></figcaption>
    <div class="row" style="gap:10px;align-items:baseline"><b style="font-size:22px">${last.v}</b><span class="small muted">of 10 · ${esc(fmt(last.date))}</span>
      ${better===null?"":`<span class="small ${better?"prog-up":"prog-down"}">${better?"▲ better":"▼ harder"} than ${esc(fmt(first.date))} (${first.v})</span>`}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)}: ${pts.map(p=>`${fmt(p.date)} ${p.v}`).join(", ")}">
      ${[1,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`).join("")}
      ${pts.length>1?`<path d="${line}" class="ln"/>`:""}
      ${pts.map((p,i)=>`<g class="pt"><circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="12" class="hit"/><circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="6" class="dot"/><title>${esc(fmt(p.date))}: ${p.v} of 10 · ${esc(p.src)}${p.text?" · "+esc(p.text):""}</title></g>`).join("")}
      <text x="${L}" y="${H-6}" class="ax">${esc(fmt(first.date))}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end" class="ax">${esc(fmt(last.date))}</text>`:""}
    </svg></figure>`;
}
function progCharts(entries, keys){
  return PROG_MEASURES.filter(m=>!keys||keys.includes(m.k)).map(m=>{ const pts=entries.filter(e=>e.vals&&e.vals[m.k]!=null).map(e=>({date:e.date, v:e.vals[m.k], src:e.src, text:(e.texts||{})[m.k]||""}));
    return pts.length ? progChart(m, pts) : ""; }).join("");
}
function progTimeline(entries, forClient){
  const lab={well:"Overall",main:"Main concern",c2:"2nd concern",c3:"3rd concern",energy:"Energy",sleep:"Sleep",mood:"Mood",stress:"Stress",dawn:forClient?"Dawn's rating":"Your rating"};

      <div class="row" style="gap:8px"><b>${esc(fmtDate(String(e.date).slice(0,10)))}</b><span class="small muted">${esc(forClient&&e.src==="Dawn's note"?"Note from Dawn":e.src)}</span>${!forClient&&e.src==="Dawn's note"?(e.shared?'<span class="chip ok">Client sees this</span>':'<span class="chip">Private</span>'):""}</div>
      ${chips?`<div class="row" style="gap:4px;flex-wrap:wrap">${chips}</div>`:""}
      ${e.overall?`<span class="small">Overall: <b>${esc(e.overall)}</b></span>`:""}
      ${concerns.length?`<span class="small muted">Concerns: ${concerns.map((t,i)=>`${i+1}. ${esc(t)}`).join(" · ")}</span>`:""}
      ${e.note?`<span class="small" style="white-space:pre-line">${esc(e.note)}</span>`:""}</div>
      ${!forClient&&e.src==="Dawn's note"?`<button type="button" class="ghost small" data-progedit="${esc(e.id)}">Edit</button>`:""}</div>`; }).join("");
}

  // orders + billing

  const orders=invs.filter(v=>v.source==="website" && v.status!=="void" && (v.date||"")>=agoS).sort((a,b)=>(b.createdAt||b.date||"").localeCompare(a.createdAt||a.date||""));
  const open=invs.filter(invOpen), owed=r2(open.reduce((s,v)=>s+invMath(v).bal,0)), overdue=open.filter(v=>invStatus(v)[0]==="Overdue");
  // date-change requests, scan reminders
  const asks=ids.filter(id=>S.clients[id].reschedReq), rem=autoOn("reminders")?[]:remindersDue();
  const dueSoon=ids.map(id=>({id, nv:S.clients[id].nextVisit})).filter(({id,nv})=>/^\d{4}-\d{2}-\d{2}$/.test(nv||"") && nv<=wkS && !S.clients[id].scanToSchedule && !upcomingAppts(S.clients[id]).some(a=>a.type==="scan") && !apptsOf(S.clients[id]).some(a=>a.type==="scan" && a.date>=nv)).sort((a,b)=>a.nv.localeCompare(b.nv));
  const need=ids.filter(id=>S.clients[id].scanToSchedule).sort((a,b)=>(S.clients[a].scanToSchedule.by||"").localeCompare(S.clients[b].scanToSchedule.by||""));
  const card=(title, count, body, foot)=>`<section class="dash-card"><div class="head"><h2>${title}</h2>${count?`<span class="count">${count}</span>`:""}</div>${body}${foot||""}</section>`;
  const empty=s=>`<p class="small muted">${s}</p>`;
  const cards=[
    card("This week", week.length, week.length?`<div>${week.slice(0,8).map(({id,a})=>row(id,"appts",`<b>${nm(id)}</b><span class="small muted">${esc(dayLbl(a.date))}${a.time?` · ${esc(fmtTime12(a.time))}`:""} · ${esc(apptLabel(a))}</span>`, a.date===t?'<span class="chip acc">Today</span>':"")).join("")}</div>${week.length>8?`<p class="small muted">and ${week.length-8} more</p>`:""}`:empty("Nothing scheduled in the next 7 days."), `<button type="button" class="ghost" data-htab="schedule">Full schedule</button>`),
    card("Messages", unread.length, unread.length?`<div>${unread.slice(0,6).map(id=>row(id,"messages",`<b>${nm(id)}</b><span class="small muted">${esc(fmtWhen(S.clients[id].lastMsg.at))}</span>`,'<span class="dot" aria-label="unread"></span>')).join("")}</div>`:empty("All caught up."), `<button type="button" class="ghost" data-htab="inbox">All messages</button>`),
    card("New forms in", forms.length, forms.length?`<div>${forms.slice(0,6).map(id=>row(id,"",`<b>${nm(id)}</b><span class="small muted">${esc(formKind(S.clients[id]))} · ${esc(fmtWhen(lastSubmitted(S.clients[id])))}</span>`,'<span class="chip acc">New</span>')).join("")}</div>`:empty("No new forms since you last looked.")),
    card("Website orders", orders.length, orders.length?`<div>${orders.slice(0,6).map(v=>row(v.clientId,"billing",`<b>${nm(v.clientId)}</b><span class="small muted">${esc(fmtDate(v.date))} · ${esc((v.items||[])[0]?.desc||"Order")}</span>`,`<b>${esc(money(invMath(v).total))}</b>`)).join("")}</div>`:empty("No website orders in the last 7 days.")),
    card("To ship", ship.length, ship.length?`<div>${ship.slice(0,6).map(({id,a})=>row(id,"appts",`<b>${nm(id)}</b><span class="small muted">Scan ${esc(dayLbl(a.date))}</span>`,'<span class="chip acc">To ship</span>')).join("")}</div>`:empty("Nothing waiting to ship this week.")),
    card("Billing", overdue.length?`${overdue.length} overdue`:"", `<div class="row" style="gap:20px"><span><span class="small muted">Outstanding</span><br><b style="font-size:22px">${esc(money(owed))}</b></span><span><span class="small muted">Unpaid invoices</span><br><b style="font-size:22px">${open.length}</b></span></div>
      ${overdue.length?`<div>${overdue.slice(0,4).map(v=>row(v.clientId,"billing",`<b>${nm(v.clientId)}</b><span class="small muted">#${esc(v.number)} · due ${esc(fmtDate(v.due))}</span>`,`<b>${esc(money(invMath(v).bal))}</b>`)).join("")}</div>`:""}`, `<button type="button" class="ghost" data-htab="billing">Billing</button>`),
  ];
  if(dueSoon.length) cards.splice(1,0,card("Next scan due", dueSoon.filter(x=>x.nv<t).length?`${dueSoon.filter(x=>x.nv<t).length} past due`:dueSoon.length, `<div>${dueSoon.slice(0,8).map(({id,nv})=>{ const dd=dayDiff(nv,t); return row(id,"appts",`<b>${nm(id)}</b><span class="small muted">Drops finish${dd<0?"ed":""} ${esc(dayLbl(nv))}${scanFormIn(S.clients[id])?" · form in":""}</span>`, dd<0?`<span class="chip warn">${-dd} day${dd===-1?"":"s"} past due</span>`:dd===0?'<span class="chip acc">Today</span>':`<span class="chip">in ${dd} day${dd===1?"":"s"}</span>`); }).join("")}</div>${dueSoon.length>8?`<p class="small muted">and ${dueSoon.length-8} more</p>`:""}<p class="small muted">Drops finished or finishing this week, with no scan booked yet.</p>`));
  if(need.length) cards.splice(1,0,card("Needs a scan date", need.length, `<div>${need.map(id=>{ const n=S.clients[id].scanToSchedule, late=(n.by||"")<t; return `<button type="button" class="dash-row dash-link" data-hneed="${esc(id)}"><span style="display:flex;flex-direction:column;min-width:0;text-align:left"><b>${nm(id)}</b><span class="small muted">${n.source==="form"?"Form sent":"Ordered"} ${esc(fmtDate(n.orderedAt))}${n.delivery==="ship"?" · shipped":n.delivery==="none"?" · reports only":n.delivery==="imprint"?" · remote imprint":""}</span></span>${n.zoom==="yes"?'<span class="chip ok">with Zoom</span>':n.zoom==="no"?'<span class="chip">scan only</span>':""}<span class="chip ${late?"warn":"acc"}">by ${esc(dayLbl(n.by))}</span></button>`; }).join("")}</div>`));
  if(asks.length) cards.splice(1,0,card("Date change requests", asks.length, `<div>${asks.map(id=>row(id,"appts",`<b>${nm(id)}</b><span class="small muted">asked ${esc(fmtWhen(S.clients[id].reschedReq.at))}</span>`,'<span class="chip warn">Asked</span>')).join("")}</div>`));
  if(rem.length) cards.push(card("Scan reminders to send", rem.length, `<div>${rem.slice(0,6).map(({id,kind})=>row(id,"appts",`<b>${nm(id)}</b><span class="small muted">${kind==="week"?"Week before":"Drops finished"} · scan ${esc(fmtDate(S.clients[id].nextVisit))}</span>`)).join("")}</div>`, `<button type="button" class="ghost" data-htab="clients">Send from Clients</button>`));
  const hr=new Date().getHours(), hi=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  $("#app").innerHTML=`<div class="stack" style="gap:20px;max-width:1180px;margin:0 auto">
    <div class="dash-hello"><h1>${hi}, Dawn</h1><p class="muted">${esc(new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}</p></div>
    ${!S.clientsLoaded?`<div class="empty">Loading…</div>`:`<div class="dash-grid">${cards.join("")}</div>`}</div>`;
  $("#app").onclick=e=>{ const nd=e.target.closest("[data-hneed]"); if(nd){ const id=nd.dataset.hneed, n=S.clients[id].scanToSchedule||{}; openClientAt(id,"appts"); S.apptEdit={cid:id, isNew:true, a:{id:genId().slice(0,10), type:"scan", date:"", ...(n.delivery?{delivery:n.delivery}:{})}}; renderClients(); $("#ap-date")?.focus(); return; }
    const o=e.target.closest("[data-hopen]"); if(o){ openClientAt(o.dataset.hopen, o.dataset.hsub||""); return; }
    const tb=e.target.closest("[data-htab]"); if(tb){ S.tab=tb.dataset.htab; store("wfw.tab",S.tab); renderTabs(); render(); window.scrollTo(0,0); } };
}

function monthlySummary(){
  const rows={}; const mk=m=>rows[m]=rows[m]||{m, income:0, scans:0, consults:0, newClients:0};
  Object.values(S.inv||{}).filter(v=>v.status==="sent").forEach(v=>(v.payments||[]).forEach(p=>{ if(p.date) mk(p.date.slice(0,7)).income+=+p.amount||0; }));
  Object.values(S.clients||{}).forEach(c=>{ apptsOf(c).filter(a=>a.date<=today()).forEach(a=>{ if(a.type==="scan") mk(a.date.slice(0,7)).scans++; if(a.type==="consult") mk(a.date.slice(0,7)).consults++; }); if(c.createdAt) mk(c.createdAt.slice(0,7)).newClients++; });

function downloadCsv(name, rows){ const q=v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  saveBlob(new Blob(["﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}), name); }
function csvPayments(){ const out=[["Date","Client","Invoice","Method","Amount","Note"]];
  Object.values(S.inv||{}).filter(v=>v.status==="sent").forEach(v=>(v.payments||[]).forEach(p=>out.push([p.date, clientName(v.clientId), v.number, p.method||"", r2(p.amount).toFixed(2), p.note||""])));
  out.splice(1, out.length, ...out.slice(1).sort((a,b)=>String(a[0]).localeCompare(String(b[0])))); downloadCsv(`Payments ${today()}.csv`, out); }
function csvInvoices(){ const out=[["Invoice","Date","Due","Client","Status","Items","Total","Paid","Balance","Source"]];

function isFamilyShell(id){
  if(id.includes("~") || id.startsWith("c-")) return false;
  const c=S.clients[id]||{}; if(!Object.keys(S.clients).some(x=>x.startsWith(id+"~"))) return false;
  const filled=k=>c[k] && typeof c[k]==="object" && Object.values(c[k]).some(v=>v!=="" && v!=null && v!==false);
  return !(c.intakeSubmittedAt||c.qestSubmittedAt||c.followupSubmittedAt||filled("intake")||filled("qest")||(c.appointments||[]).length||c.nextVisit||c.lastMsg||c.name);
}

function lastSubmitted(c){ return [c.intakeSubmittedAt||"", c.qestSubmittedAt||"", c.followupSubmittedAt||""].sort().pop(); }

function intakeChip(c){

/* ---------- Reports & files (Supabase Storage, bucket "client-files") ---------- */
const FILE_BUCKET = "client-files";
/* Storage doesn't accept "~" in file names, which family-member ids contain. */
const storeFolder = id => String(id).replace(/~/g, "_");
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function fileRow(f, prac){

    <button type="button" data-fopen="${esc(f.id)}">Open</button>
    ${prac?`<button type="button" class="ghost" data-fshare="${esc(f.id)}">${f.status==="shared"?"Hide from client":"Share with client"}</button>
    ${S.confirmFileDel===f.id?`<button type="button" class="danger" data-fdel="${esc(f.id)}">Confirm delete</button>`:`<button type="button" class="ghost danger" data-faskdel="${esc(f.id)}">Delete</button>`}`:""}
  </div>`;
}
function filesPane(id){

  return `<div class="stack">
    <p class="small muted">Upload Qest4 reports, wellness reports or anything else for this client (PDF or images, up to 50 MB each). Files stay private until you press “Share with client”; then they appear under “My reports” in the client's portal.</p>
    ${id.startsWith("c-")?(clientEmail(id)?`<div class="notice ok">${esc(clientName(id))} hasn't signed in yet. When they sign in at portal.dawnspain.com with <b>${esc(clientEmail(id))}</b>, files you've shared here appear for them under “My reports.”</div>`:`<div class="notice warn">Add this client's email under Details so their shared files appear when they sign in.</div>`):""}
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <label class="btn primary" for="file-up" style="cursor:pointer">Upload files</label><input type="file" id="file-up" class="sr" multiple accept=".pdf,image/*,.doc,.docx">
      <label class="check small"><input type="checkbox" id="file-share-now" checked> Share with client right away</label>
      ${clientEmail(id) && files.some(f=>f.status==="shared") ? `<button type="button" data-act="notifyfiles" data-id="${esc(id)}" title="Opens an email to the client in your Mail app" style="margin-left:auto" class="${autoOn("reports")?"ghost small":""}">${autoOn("reports")?"Email them again":"Let client know"}</button>` : ""}
    </div>
    <div id="file-status" class="small muted"></div>
    <div class="stack" style="gap:8px">${!S.filesLoaded&&S.filesFor===id?`<div class="empty">Loading…</div>`:files.length?files.map(f=>fileRow(f,true)).join(""):`<div class="empty small">No files yet.</div>`}</div>
  </div>`;
}
async function openClientFile(f){
  const w = window.open("", "_blank");
  const { data, error } = await SB.storage.from(FILE_BUCKET).createSignedUrl(f.path, 300);
  if(error || !data?.signedUrl){ if(w) w.close(); toast("Couldn't open that file. Try again."); return; }
  if(w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
}
async function uploadClientFiles(id, fileList, share){
  const st=$("#file-status"); const list=[...fileList]; let ok=0;
  for(const [i,file] of list.entries()){
    if(file.size>50*1048576){ toast(`${file.name} is over 50 MB`); continue; }
    if(st) st.textContent=`Uploading ${i+1} of ${list.length}: ${file.name}…`;
    const fid=genId(); const safe=file.name.replace(/[^\w.\- ]+/g,"_"); const path=`${storeFolder(id)}/${fid}-${safe}`;
    const { error } = await SB.storage.from(FILE_BUCKET).upload(path, file, { contentType:file.type||"application/octet-stream", upsert:false });
    if(error){ console.warn(error); toast(`${file.name} didn't upload: ${error.message}`); continue; }
    await S.db.doc(`clients/${id}/files/${fid}`).set({ name:file.name, title:file.name.replace(/\.[^.]+$/,""), path, size:file.size, type:file.type, status: share?"shared":"private", uploadedAt:new Date().toISOString() });
    ok++;
  }
  if(st) st.textContent = ok ? `${ok} file${ok===1?"":"s"} uploaded.` : "";
  if(ok) toast(`${ok} file${ok===1?"":"s"} uploaded`);
}

  }
  if(S.photoFor!==id){
    S.photoUnsub && S.photoUnsub(); S.photoFor=id; S.photo="";
    S.photoUnsub = S.db.doc(`clients/${id}/media/photo`).onSnapshot(s => { S.photo = s.exists ? (s.data().dataUrl||"") : ""; if(S.tab==="clients" && S.sel===id && S.sub==="qest") render(); }, e=>console.warn(e));

  }
  if(S.progFor!==id){

    S.progUnsub = S.db.collection(`clients/${id}/progress`).onSnapshot(s => { S.prog = s.docs.map(d=>({id:d.id,...d.data()})); if(S.tab==="clients" && S.sel===id && S.sub==="progress" && !document.activeElement?.closest?.("#prog-form")) render(); }, e=>console.warn(e));
  }
  if(S.qhistFor!==id){
    S.qhistUnsub && S.qhistUnsub(); S.qhistFor=id; S.qhist=[];
    S.qhistUnsub = S.db.collection(`clients/${id}/qestForms`).onSnapshot(s => { S.qhist = s.docs.map(d=>d.data()).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||"")); if(S.tab==="clients" && S.sel===id && (S.sub==="qest"||S.sub==="progress") && !document.activeElement?.closest?.("#prog-form")) render(); }, e=>console.warn(e));
  }
  if(S.filesFor!==id){
    S.filesUnsub && S.filesUnsub(); S.filesFor=id; S.files=[]; S.filesLoaded=false;
    S.filesUnsub = S.db.collection(`clients/${id}/files`).onSnapshot(snap => { S.files = snap.docs.map(d=>({id:d.id,...d.data()})); S.filesLoaded=true; if(S.tab==="clients" && S.sel===id && S.sub==="files" && !document.activeElement?.closest?.("#notesBox")) render(); }, e=>console.warn(e));
  }
  if(S.plansFor!==id){
    S.plansUnsub && S.plansUnsub(); S.plansFor=id; S.plans=[]; S.plansLoaded=false;
    S.plansUnsub = S.db.collection("clients/"+id+"/plans").onSnapshot(snap => {
      S.plans = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      S.plansLoaded = true; if(S.tab==="clients" && S.sel===id && S.sub==="plans") render();
    }, e=>console.warn(e));
  }
  if(S.msgsFor!==id){
    S.msgsUnsub && S.msgsUnsub(); S.msgsFor=id; S.msgs=[]; S.msgsLoaded=false;
    S.msgsUnsub = S.db.collection(`clients/${id}/messages`).onSnapshot(snap => { S.msgs = snap.docs.map(d=>({id:d.id,...d.data()})); S.msgsLoaded=true;
      if(S.tab==="clients" && S.sel===id && S.sub==="messages" && !document.activeElement?.closest?.("#msg-box, #compose")){ render(); msgScroll(); } }, e=>{ console.warn(e); S.msgsLoaded=true; });
  }
  if(S.notesFor!==id){
    S.notesUnsub && S.notesUnsub(); S.notesFor=id; S.notes="";
    S.notesUnsub = S.db.doc("notes/"+id).onSnapshot(s => { const v = s.exists ? (s.data().text||"") : ""; const changed = v!==S.notes; S.notes=v;
      if(changed && S.tab==="clients" && S.sel===id && S.sub==="notes" && document.activeElement?.id!=="notesBox") render(); }, e=>console.warn(e));

function planEditor(ep){
  const p = ep.data;
  const typeSel = (b,i) => `<select data-bf="form" data-formsel="${i}" aria-label="Type for item ${i+1}" style="width:auto;padding:4px 8px">${FORM_ORDER.map(f=>`<option value="${f}" ${itemForm(p,b)===f?"selected":""}>${f==="wet"?"Wet dose bottle":f==="tt1"?"TT-1 basket":"Pellets"}</option>`).join("")}</select>`;
  const items = p.bottles.map((b,i) => {
    const f=itemForm(p,b), lbl=itemLabelAt(p,i), u=FORMS[f].one.toLowerCase();
    if(f==="pellets") return `<div class="bottle" data-b="${i}">
      <div class="bottle-head"><span class="bottle-num">${lbl}</span>${typeSel(b,i)}<input class="grow mono" data-bf="remedies" value="${esc(remedyLines(b.remedies).join(", "))}" placeholder="Arnica 30C" aria-label="${lbl}"><button type="button" class="ghost danger" data-act="rmbottle" data-i="${i}" aria-label="Remove ${lbl}">Remove</button></div>
      <div class="grid2">
        <label class="field"><span>What it's for (optional)</span><input data-bf="issue" value="${esc(b.issue)}" placeholder="Bruising"></label>
        <label class="field"><span>Frequency</span><input data-bf="freq" list="freqs" value="${esc(b.freq)}" placeholder="2D"><small class="muted">${esc(plainFreq(b.freq))}</small></label>
        <label class="field"><span>How long</span><input data-bf="duration" value="${esc(b.duration)}" placeholder="3 weeks"></label>
      </div>
      <label class="field"><span>Note for client</span><input data-bf="notes" value="${esc(b.notes)}" placeholder="Take 15 minutes before food"></label>
    </div>`;
    return `<div class="bottle" data-b="${i}">
      <div class="bottle-head"><span class="bottle-num">${lbl}</span>${typeSel(b,i)}<input class="grow" data-bf="issue" value="${esc(b.issue)}" placeholder="Issue, e.g. Sinus congestion" aria-label="Issue for ${lbl}"><button type="button" class="ghost" data-act="bottlelib" data-i="${i}" title="Find a protocol in the library and add it to this ${u}">+ Add protocol</button><button type="button" class="ghost danger" data-act="rmbottle" data-i="${i}" aria-label="Remove ${lbl}">Remove</button></div>
      <label class="field"><span>Remedies</span><textarea data-bf="remedies" class="mono" style="min-height:58px" placeholder="Sanguinaria 200 + Belladonna 3C">${esc(b.remedies)}</textarea></label>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <input data-remname="${i}" list="remlist" placeholder="Add a remedy, e.g. Arnica or Moldavite" aria-label="Remedy to add to ${lbl}" style="flex:1 1 220px">
        <select data-rempot="${i}" aria-label="Potency" style="width:auto">${POTENCIES.map(x=>`<option value="${x}">${x||"Potency"}</option>`).join("")}</select>
        <button type="button" data-act="addremedy" data-i="${i}">Add remedy</button>
      </div>
      <div class="grid2">
        <label class="field"><span>Frequency</span><input data-bf="freq" list="freqs" value="${esc(b.freq)}" placeholder="2D"><small class="muted">${esc(plainFreq(b.freq))}</small></label>
        <label class="field"><span>How long</span><input data-bf="duration" value="${esc(b.duration)}" placeholder="3 months, then review"></label>
      </div>
      <label class="field"><span>Note for client</span><input data-bf="notes" value="${esc(b.notes)}" placeholder="Take 15 minutes before food"></label>
    </div>`;
  }).join("");
  return `<div class="stack">
    <div class="row"><button type="button" class="ghost" data-act="closeplan">← Plans</button><span class="grow"></span>${ep.dirty?'<span class="chip warn">Unsaved changes</span>':""}</div>
    <div class="grid2">
      <label class="field"><span>Plan title</span><input id="pl-title" value="${esc(p.title)}"></label>
      <label class="field"><span>Date</span><input id="pl-date" type="date" value="${esc(p.date)}"></label>
      <label class="field"><span>Visibility</span><select id="pl-status"><option value="draft" ${p.status!=="shared"?"selected":""}>Draft (only you)</option><option value="shared" ${p.status==="shared"?"selected":""}>Shared with client</option></select></label>
    </div>
    ${p.previousId ? `<div class="notice ok small">Updated from the plan of ${esc(fmtDate(p.previousDate)||"an earlier date")}. That plan is kept as it was. ${p.status==="shared"?"":"When you share this one, the client sees it as their current plan and the earlier one moves to <b>Previous plans</b>."}</div>` : ""}
    ${p.replacedBy ? `<div class="notice small">This is a previous plan. A newer plan has replaced it; the client sees it under <b>Previous plans</b>.</div>` : ""}
    <p class="small muted" style="margin:0">Mix and match: each item can be a wet dose bottle, a TT-1 basket or pellets. Change an item's type with the menu next to its name.</p>
    ${items || `<div class="empty small">Nothing added yet. Add a bottle, basket or pellet remedy below, or use “Add to plan” on any protocol line in the library.</div>`}
    <div class="row" style="gap:6px;flex-wrap:wrap"><button type="button" data-act="addbottle" data-form="wet">+ Wet dose bottle</button><button type="button" data-act="addbottle" data-form="tt1">+ TT-1 basket</button><button type="button" class="ghost" data-act="tolibrary">Add from protocol library</button></div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <input data-remname="p" list="remlist" placeholder="Add a pellet remedy, e.g. Arnica" aria-label="Pellet remedy to add" style="flex:1 1 220px">
      <select data-rempot="p" aria-label="Potency" style="width:auto">${POTENCIES.map(x=>`<option value="${x}">${x||"Potency"}</option>`).join("")}</select>
      <button type="button" data-act="addremedy" data-i="p">+ Pellets</button>
    </div>
    <datalist id="remlist"></datalist>
    <datalist id="freqs">${FREQS.map(f=>`<option value="${f}">${esc(plainFreq(f))}</option>`).join("")}</datalist>
    <label class="field"><span>Other recommendations</span><textarea id="pl-extra" style="min-height:80px" placeholder="Type anything here: a remedy, supplement, essence or product that isn't in the list. The client sees it exactly as you write it.">${esc(p.extra||"")}</textarea></label>
    <label class="field"><span>Instructions for the client</span><textarea id="pl-instr" style="min-height:96px" placeholder="How to take the remedies in this plan">${esc(p.instructions)}</textarea></label>
    <div class="row"><button type="button" class="primary" data-act="saveplan">Save plan</button><button type="button" data-act="pdfplan">Download PDF</button><button type="button" data-act="copyplan">Copy as text</button>${planTplSaveBox()}${ep.id ? `<button type="button" data-act="updateplan" title="Start a new plan from this one. This plan stays as it is.">Update plan (new copy)</button>` : ""}${ep.id && p.status==="shared" && !ep.dirty && clientEmail(ep.clientId) ? `<button type="button" data-act="notifyplan" title="Opens an email to the client in your Mail app">Let client know</button>` : ""}
      <span class="grow"></span>${ep.id ? (S.confirmPlanDel ? `<button type="button" class="danger" data-act="delplan">Confirm delete</button>` : `<button type="button" class="ghost danger" data-act="askdelplan">Delete plan</button>`) : ""}</div>
    <div id="copyArea"></div>
  </div>`;
}

function remedyChoices(){
  const out=new Map(); const add=(v,hint)=>{ const k=v.toLowerCase(); if(v && !out.has(k)) out.set(k,[v,hint||""]); };
  (S.settings.myRemedies||[]).forEach(n=>add(n,"Your remedy"));
  GRIFFITH.forEach(([n,v])=>add(n,`New Materia Medica, Vol ${v}`));
  if(R.rep) R.rep.remedies.forEach((r,i)=>add(r[1], i>=(R.kentRems??Infinity) ? (R.remSrc?.[i]||"Griffith repertory") : "Kent / Boericke"));
  if(R.books) R.books.nar.mixes.forEach(m=>add("Narayani "+titleCase(m.name),`${m.potency} (${m.code})`));
  if(R.books) R.books.gbot.forEach(g=>add(titleCase(g.remedy),"Getting Back on Track (Jill Turland)"));
  ESSENCES.forEach(([n,src])=>add(n+(src.startsWith("Bach")?" (Bach)":" (flower essence)"), src==="Flower essence" ? "Feel Good Flower Essences" : src));
  (S.combos||[]).forEach(c=>add(c.code+(c.name?" "+c.name:""),"Combination"));
  return [...out.values()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function fillRemedyList(){ const dl=$("#remlist"); if(!dl) return; dl.innerHTML=remedyChoices().map(([v,h])=>`<option value="${esc(v)}">${esc(h)}</option>`).join(""); }
function ensureRemedyList(){
  fillRemedyList();
  if(!R.rep) loadRep().then(fillRemedyList).catch(()=>{});
  if(!R.books) loadBooks().then(fillRemedyList).catch(()=>{});
}

function readPlanForm(){
  const ep=S.editPlan; if(!ep) return;
  const v = id => document.getElementById(id);
  if(v("pl-title")) ep.data.title = v("pl-title").value;
  if(v("pl-date")) ep.data.date = v("pl-date").value;
  if(v("pl-status")) ep.data.status = v("pl-status").value;
  if(v("pl-instr")) ep.data.instructions = v("pl-instr").value;
  if(v("pl-extra")) ep.data.extra = v("pl-extra").value;
  document.querySelectorAll(".bottle").forEach(el => { const b = ep.data.bottles[+el.dataset.b]; if(!b) return;
    el.querySelectorAll("[data-bf]").forEach(inp => b[inp.dataset.bf] = inp.value); });
}
function planText(p, name){
  const lines = [`${p.title||"Treatment plan"} — ${name}`, fmtDate(p.date), ""];
  const groups=displayGroups(p);
  groups.flatMap(g=>g.items).forEach((b,i,all)=>{
    if(groups.length>1 && (i===0 || all[i-1]._form!==b._form)) lines.push(FORMS[b._form].many.toUpperCase(), "");
    else if(groups.length===1 && i===0 && b._tag) lines.push(b._tag, "");
    lines.push(`${b._label}: ${b.issue||""}`.trim());
    if(b.remedies) lines.push(`  ${b.remedies}`);
    if(b.freq) lines.push(`  How often: ${b.freq}${plainFreq(b.freq)?` (${plainFreq(b.freq)})`:""}`);
    if(b.duration) lines.push(`  How long: ${b.duration}`);
    if(b.notes) lines.push(`  Note: ${b.notes}`);
    lines.push("");
  });
  if((p.extra||"").trim()) lines.push("Also recommended:", p.extra.trim(), "");
  if(cleanInstr(p.instructions)) lines.push(cleanInstr(p.instructions), "");
  lines.push(`${PRACTICE.name} · ${PRACTICE.phone} · ${PRACTICE.email}`);
  return lines.join("\n");
}
function bindClients(){

  const apShip = () => { const sc=$("#ap-type")?.value==="scan", sh=$("#ap-deliv")?.value==="ship"; const f=$("#ap-ship-f"); if(f) f.hidden=!(sc&&sh); };

  const apd = $("#ap-deliv"); if(apd) apd.onchange = apShip;

  const tp = $("#cm-tpl"); if(tp) tp.onchange = () => { if(tp.value==="_fu"){ S.compose=followupMail(S.sel); renderClients(); return; } const t=(S.settings.emailTemplates||[]).find(x=>x.id===tp.value); S.compose = {...S.compose, tpl:tp.value,

function bindPhoto(pre, getId){
  const inp = document.getElementById(pre+"-photo"); if(!inp) return;
  inp.onchange = async () => {
    const id = getId(); const f = inp.files && inp.files[0]; if(!f || !id) return;
    try{ toast("Adding photo…"); const dataUrl = await resizePhoto(f);
      await S.db.doc(`clients/${id}/media/photo`).set({dataUrl, updatedAt:new Date().toISOString()});
      if(!S.prac){ S.myPhoto = dataUrl; S.clientWrite="ok"; renderClient(); }
      toast("Photo added");
    }catch(err){ console.warn(err);
      if(err?.code==="invalid_argument" && !S.prac){ S.clientWrite="denied"; renderClient(); }
      else toast(err?.message==="type"||err?.message==="read" ? "That file isn't a photo we can read. Try a JPG or PNG." : "The photo didn't save. Try again."); }
  };
}

/* Date of birth: typed as MM/DD/YYYY (slashes added as they type) or picked from a calendar; saved as YYYY-MM-DD. */
function dobToIso(t){
  const m=/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2}|\d{4})$/.exec(String(t).trim()); if(!m) return /^\d{4}-\d{2}-\d{2}$/.test(t)?t:"";
  let [_,mo,d,y]=m; mo=+mo; d=+d; y=+y; if(y<100) y += (y > (new Date().getFullYear()%100) ? 1900 : 2000);
  const dt=new Date(y, mo-1, d); if(dt.getMonth()!==mo-1 || dt.getDate()!==d) return "";
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

/* ---------- Jotform paste: turn a pasted submission into form values ---------- */
const JOT_STOP = ["Your photo","Photo","Submission Date","Submission ID","Submission IP","Edit Submission","Form Title","Reply-To","IP Address"];
function jotLabel(f){ return (f.jot||f.label).replace(/[\s*:?.]+$/,"").trim(); }
function jotDate(v){
  const t=v.trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ let y=m[3]; if(y.length===2) y=(+y>40?"19":"20")+y; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
  const d=new Date(t.replace(/(\d)(st|nd|rd|th)\b/,"$1")); if(!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return "";
}
function jotParse(text, def){
  const T=String(text||"").replace(/\r/g,"").replace(/\u00a0/g," ");
  const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");
  const fields=def.flatMap(s=>s.fields);
  const marks=[];
  const find=(label, f)=>{ const r=new RegExp("(^|\\n)[ \\t]*"+rx(label)+"[ \\t]*[*:?.]*[ \\t]*(?=\\t|\\n|:|$)","gi"); let m; while((m=r.exec(T))){ marks.push({f, start:m.index+m[1].length, end:m.index+m[0].length}); } };
  fields.forEach(f=>find(jotLabel(f), f));
  [...JOT_STOP, ...def.map(s=>s.sec)].forEach(l=>find(l.replace(/[\s*:?.]+$/,""), null));
  marks.sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start));
  const clean=[]; marks.forEach(m=>{ const last=clean[clean.length-1]; if(last && m.start<last.end) return;
    if(last && last.f && last.f.options && !T.slice(last.end, m.start).trim()){ const word=T.slice(m.start, m.end).replace(/[\s*:?.]+$/,"").trim().toLowerCase(); if(last.f.options.some(o=>o.toLowerCase()===word)) return; }
    clean.push(m); });
  const vals={}, found=new Set(), odd=[];
  clean.forEach((m,i)=>{ if(!m.f || found.has(m.f.id)) return; const raw=T.slice(m.end, i+1<clean.length?clean[i+1].start:T.length).replace(/^[\s:\t]+/,"").trim(); found.add(m.f.id); if(!raw) return;
    const f=m.f, low=raw.toLowerCase();
    if(f.type==="check"){ vals[f.id]=true; }
    else if(f.type==="date"||f.type==="dob"){ const d=jotDate(raw); if(d) vals[f.id]=d; else odd.push([f.label,raw]); }
    else if(f.type==="scale"){ const n=parseInt(raw,10); if(n>=1&&n<=10) vals[f.id]=n; else odd.push([f.label,raw]); }
    else if(f.type==="choice"){ const o=f.options.find(o=>low===o.toLowerCase())||f.options.find(o=>low.includes(o.toLowerCase())||o.toLowerCase().includes(low)); if(o) vals[f.id]=o; else odd.push([f.label,raw]); }
    else if(f.type==="multi"){ const os=f.options.filter(o=>low.includes(o.toLowerCase())); if(os.length) vals[f.id]=os; else odd.push([f.label,raw]); }
    else vals[f.id]= f.type==="textarea" ? raw : raw.split(/\n+/).map(x=>x.trim()).filter(Boolean).join(", ");
  });
  return {vals, count:Object.keys(vals).length, total:fields.length, odd};
}

/* Each item in a plan has its own type: a wet dose bottle, a TT-1 basket or a pellet remedy.
   Older plans set one type for the whole plan (p.form); items without their own type use it. */
const FORMS = {wet:{one:"Bottle", many:"Wet dose bottles", tag:""}, tt1:{one:"Basket", many:"TT-1 baskets", tag:"TT-1"}, pellets:{one:"Remedy", many:"Pellets", tag:"Pellets"}};
const FORM_ORDER = ["wet","tt1","pellets"];
const itemForm = (p, b) => FORMS[b?.form] ? b.form : FORMS[p?.form] ? p.form : "wet";

const isTT1 = p => (p?.bottles||[]).length>0 && (p.bottles).every(b=>itemForm(p,b)==="tt1") || (!(p?.bottles||[]).length && p?.form==="tt1");
const unitWord = p => isTT1(p) ? "Basket" : "Bottle";
function numberInType(p, i){ const bs=p.bottles||[], f=itemForm(p,bs[i]); return bs.slice(0,i+1).filter(b=>itemForm(p,b)===f).length; }

  const c={wet:0,tt1:0,pellets:0}; (p.bottles||[]).forEach(b=>c[itemForm(p,b)]++);
  const parts=[]; if(c.wet) parts.push(`${c.wet} bottle${c.wet===1?"":"s"}`); if(c.tt1) parts.push(`${c.tt1} TT-1 basket${c.tt1===1?"":"s"}`); if(c.pellets) parts.push(`${c.pellets} pellet remed${c.pellets===1?"y":"ies"}`);
  return parts.join(" · ") || "Nothing added yet";
}
/* What the client sees, grouped by type (bottles, then TT-1 baskets, then pellets), each numbered within its group.
   For pellets the remedy is the heading and "For …" moves to the note. */
function displayItems(p){
  const bs=p.bottles||[];

    const b=x.b, base={_form:f, _label:`${FORMS[f].one} ${k+1}`, _n:k+1, _tag:FORMS[f].tag};

function fmtAnswer(f, v){

  const now=new Date(); const hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const data={clientName:clientName(id), caseId:c.caseId||"", scanDate:today(), sessionNo:String(n), startTime:hh, createdAt:now.toISOString(), updatedAt:now.toISOString()};
  const ref=S.db.collection(`clients/${id}/scans`).doc(); await ref.set(data);
  openScan(id, ref.id, data);
}
function openScan(id, sid, data){
  const c=S.clients[id]||{};
  S.scan={clientId:id, id:sid, data:JSON.parse(JSON.stringify(data)), status:"Saved"}; S.lastPackage=null;
  S.scanLeft = data.cNotes || (data.cScanrem||[]).some(r=>r&&(r.scans||r.rems)) ? "consult" : (c.qest && Object.keys(c.qest).length ? "qest" : "consult");
  renderScan(); window.scrollTo(0,0);
}

  const sc=S.scan; if(!sc) return;

let SCAN_T=null;
function scanDirty(){
  readScanForm();
  const st=$("#scan-st"); if(st) st.textContent="Saving…"; if(S.scan) S.scan.status="Saving…";
  clearTimeout(SCAN_T); SCAN_T=setTimeout(saveScan, 1200);

async function saveScan(){
  const sc=S.scan; if(!sc) return; clearTimeout(SCAN_T); readScanForm();
  sc.data.updatedAt=new Date().toISOString();
  try{
    await S.db.doc(`clients/${sc.clientId}/scans/${sc.id}`).set(sc.data);
    if(sc.data.caseId && sc.data.caseId!==(S.clients[sc.clientId]||{}).caseId) S.db.doc("clients/"+sc.clientId).update({caseId:sc.data.caseId}).catch(()=>{});
    sc.status="Saved "+new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }catch(e){ console.warn(e); sc.status="Not saved. Check your connection."; }
  const st=$("#scan-st"); if(st && S.scan===sc) st.textContent=sc.status;
}

  for(let i=0;i<4;i++){ T(`init_r${i+1}_Scan`,getP(d,`init.${i}.scan`)); T(`init_r${i+1}_Reason`,getP(d,`init.${i}.reason`)); }
  for(let i=0;i<4;i++){ T(`search_r${i+1}_Search_keyword`,getP(d,`search.${i*2}`)); T(`search_r${i+1}_Search_keyword`,getP(d,`search.${i*2+1}`)); }
  for(let i=0;i<5;i++){ T(`remedy_r${i+1}_Remedy_/_product`,getP(d,`rem.${i}.name`)); T(`remedy_r${i+1}_Potency`,getP(d,`rem.${i}.pot`)); T(`remedy_r${i+1}_Notes`,getP(d,`rem.${i}.notes`)); }
  D("Imprint_method",d.impMethod); D("Carrier",d.carrier); T("Items_imprinted_(#)",d.impItems); T("Imprint_date",usDate(d.impDate)); D("Completed",d.impDone); T("Imprint_notes",d.impNotes);
  T("Drops_per_dose",d.drops); T("Times_per_day",d.perDay); T("Duration_(weeks)",d.weeks); T("Start_date",usDate(d.startDate)); T("Next_scan_/_re-test",d.nextScan); T("Session_notes_/_follow-up",d.notes);

function consultFields(d, anon){

async function fillForm(url, fields){
  const L=await loadPdfLib(); const bytes=await (await fetch(url)).arrayBuffer();
  const pdf=await L.PDFDocument.load(bytes); const form=pdf.getForm(); const missing=[];
  for(const [name,kind,v] of fields){
    try{
      if(kind==="c"){ const f=form.getCheckBox(name); v ? f.check() : f.uncheck(); }
      else if(kind==="d"){ const f=form.getDropdown(name); f.select(v ? pdfSafe(v) : " "); }
      else form.getTextField(name).setText(v ? pdfSafe(v) : "");
    }catch(e){ missing.push(name); }
  }
  if(missing.length) console.warn("PDF fields not filled:", missing);
  return new Blob([await pdf.save()], {type:"application/pdf"});
}
const recordPdf = anon => fillForm("forms/scan-session-record.pdf", recordFields(S.scan.data, anon));
const consultPdf = anon => fillForm("forms/pre-scan-consult-notes.pdf", consultFields(S.scan.data, anon).filter((x,i,arr)=>!(anon && x[0]==="Shipping_address_(if_shipping)_28" && arr.findIndex(y=>y[0]===x[0])!==i)));
function ageFrom(dob){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dob||""); if(!m) return ""; const t=new Date(); let a=t.getFullYear()-m[1]; if(t.getMonth()+1<+m[2]||(t.getMonth()+1===+m[2]&&t.getDate()<+m[3])) a--; return a>0&&a<120?String(a):""; }
const QEST_ANON = [{sec:"About the client", fields:[{id:"age",label:"Age",type:"text"},{id:"firstScan",label:"First scan with Dawn?",type:"text"}]}, ...QEST.slice(1).map(sec=>({...sec, fields:sec.fields.filter(f=>!["signature","sigDate"].includes(f.id))}))];
async function scanCsvBlob(){ const d=S.scan.data; if(!d.csv) return null; const { data, error } = await SB.storage.from(FILE_BUCKET).download(d.csv.path); if(error) throw error; return data; }
function qestPdfForScan(anon){ const id=S.scan.clientId, c=S.clients[id]||{};
  if(anon){ const q=c.qest||{}; return formPdf(QEST_ANON, {...q, age:ageFrom(q.dob)}, {kind:"Qest4 pre-scan form", who:S.scan.data.caseId||"Case ID not entered", date:c.qestSubmittedAt||q.sigDate, photo:""}); }

function hasConsult(d){ return !!(d.cNotes || (d.cSearch||[]).some(Boolean) || (d.cScanrem||[]).some(r=>r&&(r.scans||r.rems)) || d.cItem || d.cShip || Object.values(d.cInto||{}).some(Boolean) || Object.values(d.cDel||{}).some(Boolean)); }

async function uploadScanCsv(file){
  const sc=S.scan; if(!file) return; const st=$("#scan-csv-st");
  if(file.size>50*1048576){ toast("That file is over 50 MB"); return; }
  if(st) st.textContent="Uploading…";
  const safe=file.name.replace(/[^\w.\- ]+/g,"_"); const path=`${storeFolder(sc.clientId)}/scans/${sc.id}/${genId()}-${safe}`;
  const { error } = await SB.storage.from(FILE_BUCKET).upload(path, file, { contentType:"text/csv", upsert:false });
  if(error){ console.warn(error); toast("The scan file didn't upload: "+error.message); if(st) st.textContent=""; return; }
  const old=sc.data.csv; readScanForm(); sc.data.csv={name:file.name, path, size:file.size, uploadedAt:new Date().toISOString()};
  await saveScan(); if(old?.path) SB.storage.from(FILE_BUCKET).remove([old.path]).catch(()=>{});
  toast("Scan file added"); renderScan();
}
function bindScan(){
  const root=$("#scan-root");
  // Session details (name, Case ID, date, Session #) show on both the consult notes and the record.
  // Keep every copy of a field in step, so whichever one Dawn edits is the one that's saved.
  const mirror = el => { const k=el.dataset.k; root.querySelectorAll(`[data-k="${CSS.escape(k)}"]`).forEach(o=>{ if(o===el) return; if(o.type==="checkbox") o.checked=el.checked; else if(o.value!==el.value) o.value=el.value; }); };
  root.addEventListener("input", e=>{ const el=e.target.closest("[data-k]"); if(el){ mirror(el); scanDirty(); } });
  root.addEventListener("change", e=>{ const el=e.target.closest("[data-k]"); if(el){ mirror(el); scanDirty(); } });
  const csv=$("#scan-csv"); if(csv) csv.onchange=()=>uploadScanCsv(csv.files[0]);
  $("#app").onclick = async e => {
    const lt=e.target.closest("[data-left]"); if(lt){ readScanForm(); S.scanLeft=lt.dataset.left; renderScan(); return; }
    const a=e.target.closest("[data-sact]"); if(!a) return; const act=a.dataset.sact, sc=S.scan;
    if(act==="close"){ await saveScan(); S.scan=null; S.confirmScanDel=false; S.sub="scans"; renderClients(); window.scrollTo(0,0); return; }
    if(act==="askdel"){ readScanForm(); S.confirmScanDel=true; renderScan(); return; }
    if(act==="del"){ clearTimeout(SCAN_T); if(sc.data.csv?.path) SB.storage.from(FILE_BUCKET).remove([sc.data.csv.path]).catch(()=>{}); await S.db.doc(`clients/${sc.clientId}/scans/${sc.id}`).delete(); S.scan=null; S.confirmScanDel=false; S.sub="scans"; toast("Scan session deleted"); renderClients(); return; }
    if(act==="fromconsult"){ readScanForm(); const d=sc.data; let n=0;
      const ks=(d.cSearch||[]).filter(Boolean); d.search=d.search||[]; ks.forEach(k=>{ if(d.search.includes(k)) return; const i=[0,1,2,3,4,5,6,7].find(j=>!d.search[j]); if(i!=null){ d.search[i]=k; n++; } });
      const rems=(d.cScanrem||[]).flatMap(r=>String(r?.rems||"").split(/\s*[,;\n]\s*/)).filter(Boolean); d.rem=d.rem||[];
      rems.forEach(r=>{ if(d.rem.some(x=>x&&x.name===r)) return; const i=[0,1,2,3,4].find(j=>!(d.rem[j]&&d.rem[j].name)); if(i!=null){ d.rem[i]={...(d.rem[i]||{}), name:r}; n++; } });
      renderScan(); scanDirty(); toast(n?`Copied ${n} item${n===1?"":"s"} from the consult notes`:"Nothing new to copy"); return; }
    if(act==="dlphoto"){ const ph=S.photoFor===sc.clientId?S.photo:""; if(ph) fetch(ph).then(r=>r.blob()).then(b=>saveBlob(b, `${(sc.data.caseId||"No Case ID").replace(/[\/:*?"<>|]/g,"")} - photo.jpg`)); return; }
    if(act==="openclaude"){ window.open((S.settings.qcisUrl||"").trim() || "https://claude.ai/new", "_blank"); return; }
    if(act==="qcis"){
      readScanForm(); const d=sc.data, c=S.clients[sc.clientId]||{};
      const parts=["the filled Scan Session Record PDF","the Qest4 scan CSV"]; if(hasConsult(d)) parts.push("my Pre-Scan Consult Notes PDF"); if(c.qest && Object.keys(c.qest).length) parts.push("the client's Qest4 pre-scan form PDF");
      const prompt=`Please run my QCIS Scan Report (qcis-scan-report) on the attached files: ${parts.join(", ")}. Case ID ${d.caseId||"(not entered)"}, session ${d.sessionNo||"?"}, scanned ${usDate(d.scanDate)||"(date not entered)"}. The Scan Session Record is required: it separates my searches and add-on scans from QEST-directed items, so if it is not attached, stop and ask me for it. Use the Case ID only, never a client name. Produce the Practitioner Analysis, the Client Wellness Report and the Follow-Up Check-In Form.`;
      try{ navigator.clipboard.writeText(prompt); }catch(e){}
      if(!d.csv){ toast("No scan CSV yet. Add it under “Add scan CSV” first."); return; }
      if(!d.caseId){ toast("Enter the QCIS Case ID first. The package is labelled by Case ID only."); return; }
    }
    const lbl=a.textContent; a.disabled=true; a.textContent="Preparing…";
    try{
      await saveScan(); const base=scanFileBase();
      if(act==="dlrecord") saveBlob(await recordPdf(true), `${base} - 1 Scan Session Record.pdf`);
      else if(act==="dlconsult") saveBlob(await consultPdf(true), `${base} - 3 Pre-Scan Consult Notes.pdf`);
      else if(act==="dlqest") saveBlob(await qestPdfForScan(true), `${base} - 4 Qest4 pre-scan form.pdf`);
      else if(act==="dlcsv"){ const b=await scanCsvBlob(); if(b) saveBlob(b, `${base} - 2 Qest4 scan.csv`); }
      else if(act==="package"||act==="qcis"){
        const cid=(sc.data.caseId||"No Case ID").replace(/[\/:*?"<>|]/g,""), abase=`${cid} - ${sc.data.scanDate||today()} - session ${sc.data.sessionNo||""}`.trim();
        const files=[[await recordPdf(true), `${abase} - 1 Scan Session Record.pdf`]];
        const csvB=await scanCsvBlob(); if(csvB) files.push([csvB, `${abase} - 2 Qest4 scan.csv`]); else toast("No scan CSV yet. Add it, then download again.");
        if(hasConsult(sc.data)) files.push([await consultPdf(true), `${abase} - 3 Pre-Scan Consult Notes.pdf`]);
        const c=S.clients[sc.clientId]||{}; if(c.qest && Object.keys(c.qest).length) files.push([await qestPdfForScan(true), `${abase} - 4 Qest4 pre-scan form.pdf`]);
        for(const [b,n] of files){ saveBlob(b,n); await new Promise(r=>setTimeout(r,900)); }
        S.lastPackage={names:files.map(f=>f[1]), qcis:act==="qcis"}; renderScan();
        toast(`${files.length} files saved to your Downloads`);
      }
    }catch(err){ console.warn(err); toast("That didn't work. Check your connection and try again."); }
    a.disabled=false; a.textContent=lbl;
  };
}

const POTENCY_RX = /\b\d+\s*(C|X|M|MT)\b|\bMT\b|\b\d+D\b|\be\d+[HDW]\b|\beOD\b|\bSOS\b|\b(200|30|1000)\b/i;
function allEntries(){ return [...S.custom, ...S.lib]; }
function srcLabel(e){ return e.mine?"My protocols":e.source.startsWith("Rafapal")?"Rafapal":e.source.startsWith("Germany seminar")?"Germany 2012":e.source.startsWith("Twisted")?(e.source.includes("Additional")?"TT list · Additional":"TT list · Banerji"):e.source.startsWith("Banerji")?"Banerji book":e.source.startsWith("Class sheets")?e.source.replace("Class sheets: ","Class sheet · "):"Additional Banerji"; }
function entryText(e){ return (e.title+" "+(e.blocks||[]).map(b=>b.x).join(" ")).toLowerCase(); }
function hl(text, terms){
  let s = esc(text); if(!terms.length) return s;
  const rx = new RegExp("("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).map(esc).join("|")+")","gi");
  return s.replace(rx,"<mark>$1</mark>");
}

    .sort((a,b)=>{ const at=terms.every(x=>a.title.toLowerCase().includes(x)), bt=terms.every(x=>b.title.toLowerCase().includes(x)); return (bt-at) || a.title.localeCompare(b.title); });

    list.slice(0,150).map(e => `<button type="button" class="item" data-entry="${esc(e.id)}" aria-current="${sel&&sel.id===e.id}"><b>${hl(e.title,terms)}</b><span class="meta"><span>${esc(srcLabel(e))}${e.page?` · pg ${esc(e.page)}`:""}</span></span></button>`).join("") + (list.length>150?`<div class="empty small">Showing 150 of ${list.length}. Narrow the search to see more.</div>`:"");
  const listKey = S.q+"|"+S.src, oldList = $("#app .list-pane .list");
  if(oldList && oldList.offsetParent && oldList.dataset.key===listKey) S.libScroll={key:listKey, top:oldList.scrollTop};
  $("#app").innerHTML = `<div class="stack">

const G_COMMON = new Set(["red","blue","green","orange","purple","yellow","jet","clay","ruby","emerald","rainbow","silicon","rainwater","moonstone","peridot","turquoise","amethyst","aquamarine","shungite","taconite","bornite","moxa","ivory"]);
function gAliases(ab, name, full){
  const out=new Set(); const add=a=>{ a=a.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim(); if(a && (a.includes(" ") || (a.length>4 && !G_COMMON.has(a)))) out.add(a); };
  add(name); const m=(full||"").match(/\(([^)]*)\)/); if(m) m[1].split(/[;,]/).forEach(add);
  return [...out];
}
async function loadGriffith(d){

  snaps.forEach(sn=>{ if(!sn.exists) return; (sn.data().rubrics||[]).forEach(([p,l,c])=>{
    const links = l ? l.split(" ").map(t=>{ const [h,g]=t.split("."); return gi[parseInt(h,16)].toString(16)+"."+g; }).join(" ") : "";

const PLAIN_MOD = { worse:"agg", aggravated:"agg", aggravates:"agg", worsens:"agg", worsened:"agg", agg:"agg", better:"amel", relieved:"amel", improved:"amel", improves:"amel", eases:"amel", eased:"amel", helps:"amel", amel:"amel", relief:"amel" };

let PLAIN = null;
function plainNorm(s){ return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }

function plainInit(){
  if(PLAIN) return PLAIN;
  const map=new Map(); let maxN=1;
  PLAIN_DICT.trim().split("\n").forEach(line=>{
    const [l,r]=line.split("=>"); if(!r) return;
    const alts=r.split("/").map(a=>a.trim().split(/\s+/).filter(Boolean));
    l.split(",").map(x=>plainNorm(x)).filter(Boolean).forEach(k=>{ map.set(k,alts); maxN=Math.max(maxN,k.split(" ").length); });
