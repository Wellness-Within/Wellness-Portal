<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = d => { if(!d) return ""; const x = new Date(d.length===10 ? d+"T12:00:00" : d); return isNaN(x) ? d : x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const rid = p => p + Math.random().toString(36).slice(2,10);
function store(k,v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function recall(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }

const PRACTICE = { name:"Dawn Spain, PHom", phone:"252-626-4104", email:"wellnessfromwithin@icloud.com", site:"www.dawnspain.com" };
const DEFAULT_INSTRUCTIONS = "Wet dose: put 3 pellets in 2 oz of water in a spray or dropper bottle. One dose = 5 sprays or ½ dropper. Shake or tap the bottle before each dose.";

/* Frequency shorthand used in the protocols, in plain words for clients */
function plainFreq(f){
  const s = String(f||"").trim(); if(!s) return "";
  const t = s.replace(/\s+/g,"");
  const words = {1:"once",2:"twice",3:"3 times",4:"4 times",5:"5 times",6:"6 times"};
  let m;
  if((m=t.match(/^(\d)D$/i))) return (words[m[1]]||m[1]+" times")+" a day";
  if(/^eOD$/i.test(t)) return "every other day";
  if(/^eOtherNight$/i.test(t)) return "every other night";
  if((m=t.match(/^e(\d+)H$/i))) return m[1]==="1" ? "every hour" : `every ${m[1]} hours`;
  if((m=t.match(/^e(\d+)D$/i))) return `every ${m[1]} days`;
  if((m=t.match(/^e(\d+)(min|m)$/i))) return `every ${m[1]} minutes`;
  if((m=t.match(/^e(\d+)W$/i))) return m[1]==="1" ? "every week" : `every ${m[1]} weeks`;
  if(/^1W$/i.test(t)) return "once a week";
  if(/^SOS$/i.test(t)) return "as needed";
  return "";
}
const FREQS = ["1D","2D","3D","4D","eOD","e3D","1W","e10D","e14D","e1H","e2H","e3H","SOS"];

/* ---------- intake form definition ---------- */
const INTAKE = [
  {sec:"About you", note:"All sessions are remote, so Dawn needs to know how and when to reach you.", fields:[
    {id:"fullName",label:"Full name",type:"text",req:true},{id:"preferredName",label:"What you like to be called",type:"text"},
    {id:"dob",label:"Date of birth",type:"date"},
    {id:"phone",label:"Phone",type:"text"},{id:"email",label:"Email",type:"text"},
    {id:"country",label:"Country",type:"text"},
    {id:"street",label:"Street address",type:"text",wide:true},
    {id:"city",label:"City",type:"text"},{id:"state",label:"State",type:"text"},{id:"zip",label:"ZIP code",type:"text"},
    {id:"contactPref",label:"Best way to reach you",type:"choice",options:["Text","Phone call","Email"]},
    {id:"timeZone",label:"Your time zone",type:"choice",options:["Eastern","Central","Mountain","Pacific","Other"]},
    {id:"sessionTimes",label:"Best days and times for your remote sessions",type:"text"},
    {id:"referral",label:"How did you hear about Wellness From Within?",type:"text",wide:true}]},

/* Photo: resized in the browser and kept in the client's own private record */
function resizePhoto(file){
  return new Promise((res, rej) => {
    if(!file || !/^image\//.test(file.type)) return rej(new Error("type"));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .85, out = c.toDataURL("image/jpeg", q);
      while(out.length > 220000 && q > .4){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("read")); };
    img.src = url;
  });
}
function photoBlock(pre, dataUrl, editable, req){
  return `<div class="formsec stack"><h3>Your photo${req?' <b class="req" aria-hidden="true">*</b>':""}</h3>

      ${editable ? `<label class="btn" for="${pre}-photo" style="cursor:pointer">${dataUrl?"Replace photo":"Add photo"}</label><input type="file" id="${pre}-photo" accept="image/*" class="sr" data-photo="${pre}">` : ""}
    </div></div>`;
}

/* ---------- Supabase data layer: a small document store on one "docs" table ---------- */
const SB = window.supabase.createClient(WFW_CONFIG.supabaseUrl, WFW_CONFIG.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
const parentOf = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "";
const idOf = p => p.slice(p.lastIndexOf("/") + 1);
const genId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 20) : Math.random().toString(36).slice(2) + Date.now().toString(36));
function sbErr(error){ const e = new Error(error?.message || "database error"); e.code = /row-level security|permission|violates/i.test(error?.message || "") ? "invalid_argument" : (error?.code || "error"); return e; }
function docSnap(path, row){ return { id: idOf(path), exists: !!row, data: () => row ? row.data : undefined }; }

/* live listeners: one realtime channel, refetch whatever a change touches */
const LIVE = { docs: new Map(), cols: new Map(), channel: null, timer: null, dirty: new Set() };
function liveStart(){
  if(LIVE.channel) return;
  LIVE.channel = SB.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, ev => {
    const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); if(!p) return;
    LIVE.dirty.add(p); clearTimeout(LIVE.timer); LIVE.timer = setTimeout(liveFlush, 120);
  }).subscribe();
}
function liveFlush(){
  const paths = [...LIVE.dirty]; LIVE.dirty.clear();
  const docs = new Set(), cols = new Set();
  paths.forEach(p => { if(LIVE.docs.has(p)) docs.add(p); const par = parentOf(p); if(LIVE.cols.has(par)) cols.add(par); });
  docs.forEach(p => fetchDoc(p).then(s => LIVE.docs.get(p)?.forEach(l => l.cb(s))).catch(e => LIVE.docs.get(p)?.forEach(l => l.err && l.err(e))));
  cols.forEach(c => fetchCol(c).then(s => LIVE.cols.get(c)?.forEach(l => l.cb(s))).catch(e => LIVE.cols.get(c)?.forEach(l => l.err && l.err(e))));
}
async function fetchDoc(path){
  const { data, error } = await SB.from("docs").select("data").eq("path", path).maybeSingle();
  if(error) throw sbErr(error); return docSnap(path, data);
}
async function fetchCol(col){
  const out = []; let from = 0;
  for(;;){ const { data, error } = await SB.from("docs").select("path,data").eq("parent", col).range(from, from + 999); if(error) throw sbErr(error);
    out.push(...data); if(data.length < 1000) break; from += 1000; }
  return { docs: out.map(r => ({ id: idOf(r.path), data: () => r.data })), size: out.length };
}
function listen(map, key, fetcher, cb, err){
  liveStart(); const l = { cb, err }; if(!map.has(key)) map.set(key, new Set()); map.get(key).add(l);
  fetcher(key).then(cb).catch(e => err && err(e));
  return () => map.get(key)?.delete(l);
}
function makeDoc(path){
  return {
    id: idOf(path), path,
    get: () => fetchDoc(path),
    set: async (data) => { const { error } = await SB.from("docs").upsert({ path, parent: parentOf(path), id: idOf(path), data, updated_at: new Date().toISOString() }); if(error) throw sbErr(error); },
    update: async (data) => { const { error } = await SB.rpc("doc_merge", { p_path: path, p_data: data }); if(error) throw sbErr(error); },
    delete: async () => { const { error } = await SB.from("docs").delete().eq("path", path); if(error) throw sbErr(error); },
    onSnapshot: (cb, err) => listen(LIVE.docs, path, fetchDoc, cb, err),
  };
}
const DB = {
  doc: path => makeDoc(path),
  collection: col => ({ doc: id => makeDoc(col + "/" + (id || genId())), get: () => fetchCol(col), onSnapshot: (cb, err) => listen(LIVE.cols, col, fetchCol, cb, err) }),
};

  ["#si-email","#si-pass"].forEach(sel => { const el=$(sel); if(el) el.onkeydown = e => { if(e.key === "Enter") go(); }; });

function clientName(id){
  const c = S.clients[id] || {};
  return c.name || c.intake?.fullName || c.qest?.fullName || c.followup?.fullName || c.email || (S.profiles[id]?.name) || "Unnamed client";
}
function renderTabs(){
  const t = $("#tabs"); t.hidden = false;
  const tabs = [["clients","Clients"],["repertory","Repertory"],["mm","Materia medica"],["notes","Notes"],["library","Protocols"],["combos","Combinations"],["settings","Settings"]];
  t.innerHTML = tabs.map(([k,l]) => `<button type="button" data-tab="${k}" aria-current="${S.tab===k}">${l}</button>`).join("");
  t.onclick = e => { const b=e.target.closest("[data-tab]"); if(!b) return; S.tab=b.dataset.tab; store("wfw.tab",S.tab); renderTabs(); render(); window.scrollTo(0,0); };
}
function render(){
  if(!S.prac) return renderClient();
  store("wfw.editPlan", S.editPlan||undefined);
  (({clients:renderClients, repertory:renderRepertory, mm:renderMM, notes:renderNotes, library:renderLibrary, combos:renderCombos, settings:renderSettings})[S.tab] || renderClients)();
}

/* ---------- working-plan banner (shared by library & combos) ---------- */
function targetBanner(){
  if(!S.editPlan) return `<div class="target"><span>To add protocol lines to a treatment plan, open a client's plan first (Clients → Treatment plans).</span></div>`;
  const bs=S.editPlan.data.bottles, t=S.editPlan.target;
  const opts=`<option value="new" ${t==null||!bs[t]?"selected":""}>A new bottle</option>`+bs.map((b,i)=>`<option value="${i}" ${t===i?"selected":""}>Bottle ${i+1}${b.issue?": "+esc(b.issue):""}</option>`).join("");
  return `<div class="target"><span class="grow">Adding to <b>${esc(clientName(S.editPlan.clientId))}</b> · ${esc(S.editPlan.data.title||"Untitled plan")}
    <label style="display:inline-flex;align-items:center;gap:6px;margin-left:6px">→ <select id="plan-target" aria-label="Add protocols to" style="width:auto;padding:3px 8px">${opts}</select></label></span>
    <button type="button" class="ghost" data-act="goplan">Back to plan</button></div>`;
}
function addBottle(issue, remedies){
  if(!S.editPlan){ toast("Open a client's plan first"); return; }
  const bs=S.editPlan.data.bottles, t=S.editPlan.target;
  if(t!=null && bs[t]){
    const b=bs[t]; b.remedies = b.remedies ? b.remedies.replace(/\s+$/,"") + "\n" + (remedies||"") : (remedies||"");
    if(!b.issue && issue) b.issue = issue;
    toast(`Added to Bottle ${t+1}. Save the plan to keep it.`);
  } else {
    bs.push({issue:issue||"", remedies:remedies||"", freq:"", duration:"", notes:""});
    S.editPlan.target = bs.length-1;
    toast(`Added as Bottle ${bs.length}. More protocols now go into this bottle; change that at the top.`);
  }
  S.editPlan.dirty = true;
  render();
}
document.addEventListener("change", e => { if(e.target && e.target.id==="plan-target" && S.editPlan){ const v=e.target.value; S.editPlan.target = v==="new" ? null : +v; } });

/* ---------- Clients ---------- */
function renderClients(){ store("wfw.editPlan", S.editPlan||undefined);
  if(S.scan){ if(!document.getElementById("scan-root")) renderScan(); return; }
  const ids = Object.keys(S.clients).sort((a,b)=>(isNewForm(S.clients[b])-isNewForm(S.clients[a])) || clientName(a).localeCompare(clientName(b)));
  const f = (S.clientFilter||"").toLowerCase();
  const shown = ids.filter(id => !f || clientName(id).toLowerCase().includes(f));
  const sel = S.sel && S.clients[S.sel] ? S.sel : null;
  const list = !S.clientsLoaded ? `<div class="empty">Loading clients…</div>`
    : !ids.length ? `<div class="empty"><p>No clients yet.</p><p class="small">Add one with “New client”, or share this portal with a client and their intake appears here when they save it.</p></div>`
    : shown.map(id => { const c=S.clients[id]; const st=intakeChip(c);
        return `<button type="button" class="item" data-client="${esc(id)}" aria-current="${id===sel}"><b>${esc(clientName(id))}</b><span class="meta">${st}${!id.startsWith("c-")?'<span class="chip acc">Portal account</span>':""}${c.nextVisit?`<span>Next: ${esc(fmtDate(c.nextVisit))}</span>`:""}</span></button>`; }).join("") || `<div class="empty">No match.</div>`;
  $("#app").innerHTML = `
  <div class="panes ${sel?"has-sel":""}">
    <section class="list-pane" aria-label="Clients">
      <div class="head">
        <div class="row"><h2 class="grow">Clients</h2><button type="button" class="primary" data-act="newclient">New client</button></div>
        ${S.jotNew?`<div class="stack" style="gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px"><p class="small muted" style="margin:0">Paste a Jotform submission (intake or Qest4). A new client is made from it.</p><textarea id="jotnew-text" class="small" style="min-height:100px" placeholder="Paste the whole submission"></textarea><div class="row"><button type="button" class="primary" data-act="jotnew">Create client</button><button type="button" class="ghost" data-act="jotnewopen">Cancel</button></div><div id="jotnew-report"></div></div>`:""}
        <input id="clientFilter" type="search" placeholder="Find a client" value="${esc(S.clientFilter||"")}" aria-label="Find a client">
      </div>
      <div class="list">${list}</div>
    </section>
    <section class="detail-pane">${sel ? clientDetail(sel) : `<div class="sheet empty"><h2>Pick a client</h2><p class="small">Their intake, private notes and treatment plans open here.</p></div>`}</section>
  </div>`;
  bindClients();
}
function lastSubmitted(c){ return [c.intakeSubmittedAt||"", c.qestSubmittedAt||"", c.followupSubmittedAt||""].sort().pop(); }
function isNewForm(c){ const t=lastSubmitted(c||{}); return t && t > (c.seenAt||"") ? 1 : 0; }
function intakeChip(c){
  const out = [];
  if(isNewForm(c)) out.push(`<span class="chip warn" style="font-weight:700">New form</span>`);
  if(c.intakeStatus==="submitted") out.push(`<span class="chip ok">Intake in</span>`);
  else if(c.intake && Object.keys(c.intake).length) out.push(`<span class="chip warn">Intake started</span>`);
  if(c.qestStatus==="submitted") out.push(`<span class="chip ok">Qest4 form in</span>`);
  if((c.followupHistory||[]).length) out.push(`<span class="chip ok">Follow-up ${esc(fmtDate(c.followupSubmittedAt))}</span>`);
  else if(c.qest && Object.keys(c.qest).length) out.push(`<span class="chip warn">Qest4 form started</span>`);
  return out.join("") || `<span class="chip">No forms yet</span>`;
}
function clientDetail(id){
  const c = S.clients[id];
  const subs = [["intake","Homeopathy intake"],["followups","Follow-ups"],["qest","Qest4 form"],["plans","Treatment plans"],["files","Reports & files"],["scans","Scan sessions"],["notes","Private notes"],["details","Details"]];
  let body = "";
  if(S.sub==="intake") body = `<div class="row" style="justify-content:flex-end"><button type="button" data-act="formpdf" data-kind="intake">Download PDF</button></div>` + intakeForm(c.intake||{}, "pi") + `<div class="row"><button type="button" class="primary" data-act="saveintake">Save intake</button><label class="check small"><input type="checkbox" id="pi-submitted" ${c.intakeStatus==="submitted"?"checked":""}> Mark as complete</label></div>`;
  if(S.sub==="qest") body = (c.qest?.photoOnFile ? `<div class="notice">Returning client: asked you to use the photo already on file${S.photoFor===id && S.photo ? " (or the one below if it's newer)" : ""}.</div>` : "") + `<div class="row" style="justify-content:flex-end"><button type="button" data-act="formpdf" data-kind="qest">Download PDF</button>${S.photoFor===id && S.photo ? `<button type="button" data-act="dlphoto">Download photo</button>`:""}</div>` + photoBlock("pp", S.photoFor===id ? S.photo : "", true) + intakeForm(c.qest||{}, "ps", false, QEST) + `<div class="row"><button type="button" class="primary" data-act="saveqest">Save Qest4 form</button><label class="check small"><input type="checkbox" id="ps-submitted" ${c.qestStatus==="submitted"?"checked":""}> Mark as complete</label></div>` + qestHistory(id);
  if(S.sub==="plans") body = plansPane(id);
  if(S.sub==="files") body = filesPane(id);
  if(S.sub==="scans") body = scansPane(id);
  if(S.sub==="followups"){ const hist=(c.followupHistory||[]).slice().sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
    body = hist.length ? `<div class="stack">${hist.map((h,i)=>`<details class="hist" ${i===0?"open":""}><summary><b>${esc(fmtDate(h.submittedAt))}</b>${h.form?.overall?` · ${esc(h.form.overall)}`:""}</summary><div style="margin-top:8px"><div class="row" style="justify-content:flex-end"><button type="button" data-act="formpdf" data-kind="followup" data-i="${esc(h.submittedAt||"")}">Download PDF</button></div>${intakeForm(h.form||{}, "fu"+i, true, FOLLOWUP)}</div></details>`).join("")}</div>`
      : `<div class="empty"><p>No follow-up forms yet.</p><p class="small">Send this client <span class="mono">https://portal.dawnspain.com/#followup</span> before their next session.</p></div>`; }
  if(S.sub==="notes") body = `<div class="stack"><p class="small muted">Only you can see these notes. Clients never see this tab.</p><textarea id="notesBox" style="min-height:260px" placeholder="Case notes, Qest4 session observations, follow-up ideas">${esc(S.notesFor===id?S.notes:"")}</textarea><div class="row"><button type="button" class="primary" data-act="savenotes">Save notes</button></div></div>`;
  if(S.sub==="details") body = detailsPane(id, c);
  ensureClientSubs(id);
  return `<div class="sheet stack">
    <button type="button" class="ghost back-btn" data-act="back">← All clients</button>
    <div class="row"><h1 class="grow">${esc(clientName(id))}</h1>${intakeChip(c)}</div>
    <p class="small muted">${[c.intake?.phone||c.qest?.phone||c.phone, c.intake?.email||c.qest?.email||c.email].filter(Boolean).map(esc).join(" · ") || "No contact details yet"}</p>
    <div class="subtabs" role="tablist">${subs.map(([k,l])=>`<button type="button" role="tab" data-sub="${k}" aria-current="${S.sub===k}">${l}</button>`).join("")}</div>
    ${body}
  </div>`;
}

  return `<div class="stack">

      ${others.length ? `<div class="row"><select id="mergeTo" class="grow" aria-label="Portal record">${others.map(o=>`<option value="${esc(o)}">${esc(clientName(o))}</option>`).join("")}</select><button type="button" data-act="merge">Merge into this record</button></div>` : `<p class="small muted">No portal accounts yet.</p>`}
    </div>` : `<p class="small muted">This client has a portal account. Plans you mark “Shared” appear for them when they open the portal.</p>`}
    <div class="formsec stack"><h3>Remove client</h3>
      ${S.confirmDel===id ? `<p class="small">This deletes the record, intake and private notes. Treatment plans are deleted too.</p><div class="row"><button type="button" class="danger" data-act="delclient">Yes, delete ${esc(clientName(id))}</button><button type="button" data-act="canceldel">Keep</button></div>` : `<div class="row"><button type="button" class="danger" data-act="askdel">Delete client…</button></div>`}

/* ---------- Reports & files (Supabase Storage, bucket "client-files") ---------- */
const FILE_BUCKET = "client-files";
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function fileRow(f, prac){
  return `<div class="row" style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;gap:10px;align-items:center">
    <div class="grow" style="min-width:0"><b style="overflow-wrap:anywhere">${esc(f.title||f.name)}</b><div class="small muted">${esc(fmtDate(f.uploadedAt))} · ${esc(fmtSize(f.size||0))}${prac?(f.status==="shared"?' · <span class="chip ok">Visible to client</span>':' · <span class="chip">Only you</span>'):""}</div></div>
    <button type="button" data-fopen="${esc(f.id)}">Open</button>
    ${prac?`<button type="button" class="ghost" data-fshare="${esc(f.id)}">${f.status==="shared"?"Hide from client":"Share with client"}</button>
    ${S.confirmFileDel===f.id?`<button type="button" class="danger" data-fdel="${esc(f.id)}">Confirm delete</button>`:`<button type="button" class="ghost danger" data-faskdel="${esc(f.id)}">Delete</button>`}`:""}
  </div>`;
}
function filesPane(id){
  const files=(S.filesFor===id?S.files:[]).slice().sort((a,b)=>(b.uploadedAt||"").localeCompare(a.uploadedAt||""));
  return `<div class="stack">
    <p class="small muted">Upload Qest4 reports, wellness reports or anything else for this client (PDF or images, up to 50 MB each). Files stay private until you press “Share with client”; then they appear under “My reports” in the client's portal.</p>
    ${id.startsWith("c-")?`<div class="notice warn">You added this client yourself, so they don't have a portal sign-in. Files here are kept for you, but the client can't see them. To share reports, use the client record that shows <b>Portal account</b>; it appears once they sign in at portal.dawnspain.com.</div>`:""}
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <label class="btn primary" for="file-up" style="cursor:pointer">Upload files</label><input type="file" id="file-up" class="sr" multiple accept=".pdf,image/*,.doc,.docx">
      <label class="check small"><input type="checkbox" id="file-share-now" checked> Share with client right away</label>
      ${!id.startsWith("c-") && files.some(f=>f.status==="shared") ? `<button type="button" data-act="notifyfiles" data-id="${esc(id)}" title="Opens an email to the client in your Mail app" style="margin-left:auto">Let client know</button>` : ""}
    </div>
    <div id="file-status" class="small muted"></div>
    <div class="stack" style="gap:8px">${!S.filesLoaded&&S.filesFor===id?`<div class="empty">Loading…</div>`:files.length?files.map(f=>fileRow(f,true)).join(""):`<div class="empty small">No files yet.</div>`}</div>
  </div>`;
}
async function openClientFile(f){
  const w = window.open("", "_blank");
  const { data, error } = await SB.storage.from(FILE_BUCKET).createSignedUrl(f.path, 300);
  if(error || !data?.signedUrl){ if(w) w.close(); toast("Couldn't open that file. Try again."); return; }
  if(w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
}
async function uploadClientFiles(id, fileList, share){
  const st=$("#file-status"); const list=[...fileList]; let ok=0;
  for(const [i,file] of list.entries()){
    if(file.size>50*1048576){ toast(`${file.name} is over 50 MB`); continue; }
    if(st) st.textContent=`Uploading ${i+1} of ${list.length}: ${file.name}…`;
    const fid=genId(); const safe=file.name.replace(/[^\w.\- ]+/g,"_"); const path=`${id}/${fid}-${safe}`;
    const { error } = await SB.storage.from(FILE_BUCKET).upload(path, file, { contentType:file.type||"application/octet-stream", upsert:false });
    if(error){ console.warn(error); toast(`${file.name} didn't upload: ${error.message}`); continue; }
    await S.db.doc(`clients/${id}/files/${fid}`).set({ name:file.name, title:file.name.replace(/\.[^.]+$/,""), path, size:file.size, type:file.type, status: share?"shared":"private", uploadedAt:new Date().toISOString() });
    ok++;
  }
  if(st) st.textContent = ok ? `${ok} file${ok===1?"":"s"} uploaded.` : "";
  if(ok) toast(`${ok} file${ok===1?"":"s"} uploaded`);
}

function ensureClientSubs(id){
  if(S.scansFor!==id){
    S.scansUnsub && S.scansUnsub(); S.scansFor=id; S.scans=[]; S.scansLoaded=false;
    S.scansUnsub = S.db.collection(`clients/${id}/scans`).onSnapshot(snap => { S.scans = snap.docs.map(d=>({id:d.id,...d.data()})); S.scansLoaded=true; if(S.tab==="clients" && S.sel===id && S.sub==="scans" && !S.scan) render(); }, e=>console.warn(e));
  }
  if(S.photoFor!==id){
    S.photoUnsub && S.photoUnsub(); S.photoFor=id; S.photo="";
    S.photoUnsub = S.db.doc(`clients/${id}/media/photo`).onSnapshot(s => { S.photo = s.exists ? (s.data().dataUrl||"") : ""; if(S.tab==="clients" && S.sel===id && S.sub==="qest") render(); }, e=>console.warn(e));
  }
  if(S.qhistFor!==id){
    S.qhistUnsub && S.qhistUnsub(); S.qhistFor=id; S.qhist=[];
    S.qhistUnsub = S.db.collection(`clients/${id}/qestForms`).onSnapshot(s => { S.qhist = s.docs.map(d=>d.data()).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||"")); if(S.tab==="clients" && S.sel===id && S.sub==="qest") render(); }, e=>console.warn(e));
  }
  if(S.filesFor!==id){
    S.filesUnsub && S.filesUnsub(); S.filesFor=id; S.files=[]; S.filesLoaded=false;
    S.filesUnsub = S.db.collection(`clients/${id}/files`).onSnapshot(snap => { S.files = snap.docs.map(d=>({id:d.id,...d.data()})); S.filesLoaded=true; if(S.tab==="clients" && S.sel===id && S.sub==="files" && !document.activeElement?.closest?.("#notesBox")) render(); }, e=>console.warn(e));
  }
  if(S.plansFor!==id){
    S.plansUnsub && S.plansUnsub(); S.plansFor=id; S.plans=[]; S.plansLoaded=false;
    S.plansUnsub = S.db.collection("clients/"+id+"/plans").onSnapshot(snap => {
      S.plans = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      S.plansLoaded = true; if(S.tab==="clients" && S.sel===id && S.sub==="plans") render();
    }, e=>console.warn(e));
  }
  if(S.notesFor!==id){
    S.notesUnsub && S.notesUnsub(); S.notesFor=id; S.notes="";
    S.notesUnsub = S.db.doc("notes/"+id).onSnapshot(s => { const v = s.exists ? (s.data().text||"") : ""; const changed = v!==S.notes; S.notes=v;
      if(changed && S.tab==="clients" && S.sel===id && S.sub==="notes" && document.activeElement?.id!=="notesBox") render(); }, e=>console.warn(e));
  }
}
function plansPane(id){
  const ep = S.editPlan && S.editPlan.clientId===id ? S.editPlan : null;
  if(ep) return planEditor(ep);
  const rows = !S.plansLoaded ? `<div class="empty">Loading plans…</div>` : !S.plans.length ? `<div class="empty"><p>No treatment plans yet.</p></div>` :
    S.plans.map(p => `<button type="button" class="item" data-plan="${esc(p.id)}" style="border:1px solid var(--line);border-radius:8px"><b>${esc(p.title||"Untitled plan")}</b><span class="meta"><span>${esc(fmtDate(p.date))}</span>${p.status==="shared"?'<span class="chip ok">Shared with client</span>':'<span class="chip">Draft</span>'}<span>${(p.bottles||[]).length} bottle${(p.bottles||[]).length===1?"":"s"}</span></span></button>`).join("");

}
function planEditor(ep){
  const p = ep.data;
  const bottles = p.bottles.map((b,i) => `<div class="bottle" data-b="${i}">
      <div class="bottle-head"><span class="bottle-num">Bottle ${i+1}</span><input class="grow" data-bf="issue" value="${esc(b.issue)}" placeholder="Issue, e.g. Sinus congestion" aria-label="Issue for bottle ${i+1}"><button type="button" class="ghost" data-act="bottlelib" data-i="${i}" title="Find a protocol in the library and add it to this bottle">+ Add protocol</button><button type="button" class="ghost danger" data-act="rmbottle" data-i="${i}" aria-label="Remove bottle ${i+1}">Remove</button></div>
      <label class="field"><span>Remedies</span><textarea data-bf="remedies" class="mono" style="min-height:58px" placeholder="Sanguinaria 200 + Belladonna 3C">${esc(b.remedies)}</textarea></label>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <input data-remname="${i}" list="remlist" placeholder="Add a remedy, e.g. Arnica or Moldavite" aria-label="Remedy to add to bottle ${i+1}" style="flex:1 1 220px">
        <select data-rempot="${i}" aria-label="Potency" style="width:auto">${POTENCIES.map(x=>`<option value="${x}">${x||"Potency"}</option>`).join("")}</select>
        <button type="button" data-act="addremedy" data-i="${i}">Add remedy</button>
      </div>
      <div class="grid2">
        <label class="field"><span>Frequency</span><input data-bf="freq" list="freqs" value="${esc(b.freq)}" placeholder="2D"><small class="muted">${esc(plainFreq(b.freq))}</small></label>
        <label class="field"><span>How long</span><input data-bf="duration" value="${esc(b.duration)}" placeholder="3 months, then review"></label>
      </div>
      <label class="field"><span>Note for client</span><input data-bf="notes" value="${esc(b.notes)}" placeholder="Take 15 minutes before food"></label>
    </div>`).join("");
  return `<div class="stack">
    <div class="row"><button type="button" class="ghost" data-act="closeplan">← Plans</button><span class="grow"></span>${ep.dirty?'<span class="chip warn">Unsaved changes</span>':""}</div>
    <div class="grid2">
      <label class="field"><span>Plan title</span><input id="pl-title" value="${esc(p.title)}"></label>
      <label class="field"><span>Date</span><input id="pl-date" type="date" value="${esc(p.date)}"></label>
      <label class="field"><span>Visibility</span><select id="pl-status"><option value="draft" ${p.status!=="shared"?"selected":""}>Draft (only you)</option><option value="shared" ${p.status==="shared"?"selected":""}>Shared with client</option></select></label>
    </div>

    <label class="field"><span>Instructions for the client</span><textarea id="pl-instr" style="min-height:96px">${esc(p.instructions)}</textarea></label>
    <div class="row"><button type="button" class="primary" data-act="saveplan">Save plan</button><button type="button" data-act="pdfplan">Download PDF</button><button type="button" data-act="copyplan">Copy as text</button>${ep.id && p.status==="shared" && !ep.dirty && !ep.clientId.startsWith("c-") ? `<button type="button" data-act="notifyplan" title="Opens an email to the client in your Mail app">Let client know</button>` : ""}
      <span class="grow"></span>${ep.id ? (S.confirmPlanDel ? `<button type="button" class="danger" data-act="delplan">Confirm delete</button>` : `<button type="button" class="ghost danger" data-act="askdelplan">Delete plan</button>`) : ""}</div>
    <div id="copyArea"></div>
  </div>`;
}

function remedyChoices(){
  const out=new Map(); const add=(v,hint)=>{ const k=v.toLowerCase(); if(v && !out.has(k)) out.set(k,[v,hint||""]); };
  (S.settings.myRemedies||[]).forEach(n=>add(n,"Your remedy"));
  GRIFFITH.forEach(([n,v])=>add(n,`New Materia Medica, Vol ${v}`));
  if(R.rep) R.rep.remedies.forEach(r=>add(r[1],"Kent / Boericke"));
  if(R.books) R.books.nar.mixes.forEach(m=>add("Narayani "+titleCase(m.name),`${m.potency} (${m.code})`));
  if(R.books) R.books.gbot.forEach(g=>add(titleCase(g.remedy),"Getting Back on Track (Jill Turland)"));
  ESSENCES.forEach(([n,src])=>add(n+(src.startsWith("Bach")?" (Bach)":" (flower essence)"), src==="Flower essence" ? "Feel Good Flower Essences" : src));
  (S.combos||[]).forEach(c=>add(c.code+(c.name?" "+c.name:""),"Combination"));
  return [...out.values()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function fillRemedyList(){ const dl=$("#remlist"); if(!dl) return; dl.innerHTML=remedyChoices().map(([v,h])=>`<option value="${esc(v)}">${esc(h)}</option>`).join(""); }
function ensureRemedyList(){
  fillRemedyList();
  if(!R.rep) loadRep().then(fillRemedyList).catch(()=>{});
  if(!R.books) loadBooks().then(fillRemedyList).catch(()=>{});
}

function readPlanForm(){
  const ep=S.editPlan; if(!ep) return;
  const v = id => document.getElementById(id);
  if(v("pl-title")) ep.data.title = v("pl-title").value;
  if(v("pl-date")) ep.data.date = v("pl-date").value;
  if(v("pl-status")) ep.data.status = v("pl-status").value;
  if(v("pl-instr")) ep.data.instructions = v("pl-instr").value;
  document.querySelectorAll(".bottle").forEach(el => { const b = ep.data.bottles[+el.dataset.b]; if(!b) return;
    el.querySelectorAll("[data-bf]").forEach(inp => b[inp.dataset.bf] = inp.value); });
}
function planText(p, name){
  const lines = [`${p.title||"Treatment plan"} — ${name}`, fmtDate(p.date), ""];
  (p.bottles||[]).forEach((b,i)=>{
    lines.push(`Bottle ${i+1}: ${b.issue||""}`.trim());
    if(b.remedies) lines.push(`  ${b.remedies}`);
    if(b.freq) lines.push(`  How often: ${b.freq}${plainFreq(b.freq)?` (${plainFreq(b.freq)})`:""}`);
    if(b.duration) lines.push(`  How long: ${b.duration}`);
    if(b.notes) lines.push(`  Note: ${b.notes}`);
    lines.push("");
  });
  if(cleanInstr(p.instructions)) lines.push(cleanInstr(p.instructions), "");
  lines.push(`${PRACTICE.name} · ${PRACTICE.phone} · ${PRACTICE.email}`);
  return lines.join("\n");
}
function bindClients(){

  const cf = $("#clientFilter"); if(cf) cf.oninput = () => { S.clientFilter = cf.value; const pos=cf.selectionStart; renderClients(); const n=$("#clientFilter"); n.focus(); n.setSelectionRange(pos,pos); };
  app.querySelectorAll("[data-bf]").forEach(inp => inp.addEventListener("input", () => { if(S.editPlan && !S.editPlan.dirty){ S.editPlan.dirty=true; } if(inp.dataset.bf==="freq"){ const s=inp.parentElement.querySelector("small"); if(s) s.textContent=plainFreq(inp.value);} }));
  ["pl-title","pl-date","pl-status","pl-instr"].forEach(id => { const el=document.getElementById(id); if(el) el.addEventListener("input", ()=>{ if(S.editPlan) S.editPlan.dirty=true; }); });
  app.onclick = async e => {
    const c = e.target.closest("[data-client]"); if(c){ if(S.editPlan?.dirty && S.editPlan.clientId!==c.dataset.client){ toast("Save or close the open plan first"); return; } S.sel=c.dataset.client; S.sub="intake"; { const rec=S.clients[S.sel]; if(isNewForm(rec)){ const ls=lastSubmitted(rec); if(rec.followupSubmittedAt===ls) S.sub="followups"; else if(rec.qestSubmittedAt===ls) S.sub="qest"; S.db.doc("clients/"+S.sel).update({seenAt:new Date().toISOString()}).catch(()=>{}); } } S.confirmDel=null; renderClients(); return; }
    const fo = e.target.closest("[data-fopen]"); if(fo){ const f=S.files.find(x=>x.id===fo.dataset.fopen); if(f) openClientFile(f); return; }
    const fs = e.target.closest("[data-fshare]"); if(fs){ const f=S.files.find(x=>x.id===fs.dataset.fshare); if(f){ await S.db.doc(`clients/${S.sel}/files/${f.id}`).update({status:f.status==="shared"?"private":"shared"}); toast(f.status==="shared"?"Hidden from client":"Shared with client"); } return; }
    const fa = e.target.closest("[data-faskdel]"); if(fa){ S.confirmFileDel=fa.dataset.faskdel; renderClients(); return; }
    const fd = e.target.closest("[data-fdel]"); if(fd){ const f=S.files.find(x=>x.id===fd.dataset.fdel); if(f){ await SB.storage.from(FILE_BUCKET).remove([f.path]); await S.db.doc(`clients/${S.sel}/files/${f.id}`).delete(); S.confirmFileDel=null; toast("File deleted"); } return; }
    const sb = e.target.closest("[data-sub]"); if(sb){ readPlanForm(); S.sub=sb.dataset.sub; renderClients(); return; }
    const scn = e.target.closest("[data-scan]"); if(scn){ const x=S.scans.find(v=>v.id===scn.dataset.scan); if(x){ const {id:sid,...data}=x; openScan(S.sel, sid, data); } return; }
    const pl = e.target.closest("[data-plan]"); if(pl){ const p=S.plans.find(x=>x.id===pl.dataset.plan); S.editPlan={clientId:S.sel,id:p.id,data:JSON.parse(JSON.stringify({title:p.title||"",date:p.date||today(),status:p.status||"draft",instructions:cleanInstr(p.instructions),bottles:p.bottles||[]})),dirty:false}; S.confirmPlanDel=false; renderClients(); return; }
    const a = e.target.closest("[data-act]"); if(!a) return;
    const act = a.dataset.act;
    try{
      if(act==="back"){ S.sel=null; renderClients(); }
      else if(act==="newclient"){ const id=rid("c-"); await S.db.doc("clients/"+id).set({name:"New client", createdAt:new Date().toISOString(), intake:{}}); S.sel=id; S.sub="details"; renderClients(); setTimeout(()=>{const n=$("#d-name"); if(n){n.value="";n.focus();}},50); }
      else if(act==="jotfill"){ const txt=$("#jot-text").value; const kind=a.dataset.kind; const def=kind==="qest"?QEST:INTAKE; const r=jotParse(txt, def);

          const nm=S.clients[S.sel]?.name; if((!nm || nm==="New client") && r.vals.fullName) patch.name=r.vals.fullName;
          a.disabled=true; await S.db.doc("clients/"+S.sel).update(patch); if(kind==="qest") await S.db.collection(`clients/${S.sel}/qestForms`).doc().set({form:merged, submittedAt:new Date().toISOString(), source:"jotform"}); S.jotOpen=true; S.jotLast=r; toast("Form filled in from Jotform"); }

      else if(act==="jotnew"){ const txt=$("#jotnew-text").value; const kind=jotKind(txt); const def=kind==="qest"?QEST:INTAKE; const r=jotParse(txt, def);
        const out=$("#jotnew-report"); if(!r.count){ out.innerHTML=jotReport(r); return; }

        catch(e1){ console.warn(e1); toast("Couldn't make the PDF. Check your connection and try again."); }

          if(dl){ try{ await dl.save({filename:fname, data:blob}); }catch(e2){ if(e2?.code!=="cancelled" && e2?.code!=="declined") toast("The PDF wasn't saved."); } }
          else { const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download=fname; l.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); } }
        catch(e1){ toast("Couldn't make the PDF. Check your connection and try again."); }

function readIntake(pre, def = INTAKE){
  const out = {};
  def.forEach(s => s.fields.forEach(f => {
    const id = `${pre}-${f.id}`;
    if(f.type==="scale"){ const c = document.querySelector(`input[name="${id}"]:checked`); if(c) out[f.id]=+c.value; }
    else if(f.type==="multi"){ const c=[...document.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value); if(c.length) out[f.id]=c; }
    else if(f.type==="choice"){ const c = document.querySelector(`input[name="${id}"]:checked`); if(c) out[f.id]=c.value; }
    else if(f.type==="check"){ const el=document.getElementById(id); if(el?.checked) out[f.id]=true; }
    else { const el=document.getElementById(id); if(el && el.value.trim()) out[f.id]=el.value.trim(); }
  }));
  return out;
}


/* ---------- Jotform paste: turn a pasted submission into form values ---------- */
const JOT_STOP = ["Your photo","Photo","Submission Date","Submission ID","Submission IP","Edit Submission","Form Title","Reply-To","IP Address"];
function jotLabel(f){ return (f.jot||f.label).replace(/[\s*:?.]+$/,"").trim(); }
function jotDate(v){
  const t=v.trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ let y=m[3]; if(y.length===2) y=(+y>40?"19":"20")+y; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
  const d=new Date(t.replace(/(\d)(st|nd|rd|th)\b/,"$1")); if(!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return "";
}
function jotParse(text, def){
  const T=String(text||"").replace(/\r/g,"").replace(/\u00a0/g," ");
  const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");
  const fields=def.flatMap(s=>s.fields);
  const marks=[];
  const find=(label, f)=>{ const r=new RegExp("(^|\\n)[ \\t]*"+rx(label)+"[ \\t]*[*:?.]*[ \\t]*(?=\\t|\\n|:|$)","gi"); let m; while((m=r.exec(T))){ marks.push({f, start:m.index+m[1].length, end:m.index+m[0].length}); } };
  fields.forEach(f=>find(jotLabel(f), f));
  [...JOT_STOP, ...def.map(s=>s.sec)].forEach(l=>find(l.replace(/[\s*:?.]+$/,""), null));
  marks.sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start));
  const clean=[]; marks.forEach(m=>{ const last=clean[clean.length-1]; if(last && m.start<last.end) return;
    if(last && last.f && last.f.options && !T.slice(last.end, m.start).trim()){ const word=T.slice(m.start, m.end).replace(/[\s*:?.]+$/,"").trim().toLowerCase(); if(last.f.options.some(o=>o.toLowerCase()===word)) return; }
    clean.push(m); });
  const vals={}, found=new Set(), odd=[];
  clean.forEach((m,i)=>{ if(!m.f || found.has(m.f.id)) return; const raw=T.slice(m.end, i+1<clean.length?clean[i+1].start:T.length).replace(/^[\s:\t]+/,"").trim(); found.add(m.f.id); if(!raw) return;
    const f=m.f, low=raw.toLowerCase();
    if(f.type==="check"){ vals[f.id]=true; }
    else if(f.type==="date"){ const d=jotDate(raw); if(d) vals[f.id]=d; else odd.push([f.label,raw]); }
    else if(f.type==="scale"){ const n=parseInt(raw,10); if(n>=1&&n<=10) vals[f.id]=n; else odd.push([f.label,raw]); }
    else if(f.type==="choice"){ const o=f.options.find(o=>low===o.toLowerCase())||f.options.find(o=>low.includes(o.toLowerCase())||o.toLowerCase().includes(low)); if(o) vals[f.id]=o; else odd.push([f.label,raw]); }
    else if(f.type==="multi"){ const os=f.options.filter(o=>low.includes(o.toLowerCase())); if(os.length) vals[f.id]=os; else odd.push([f.label,raw]); }
    else vals[f.id]= f.type==="textarea" ? raw : raw.split(/\n+/).map(x=>x.trim()).filter(Boolean).join(", ");
  });
  return {vals, count:Object.keys(vals).length, total:fields.length, odd};
}
function jotKind(text){ const t=String(text||"").toLowerCase(); return /areas where you would like support|wellness services acknowledgement|first scan with dawn/.test(t) ? "qest" : "intake"; }
function jotPanel(kind){
  return `<details class="jotpanel"${S.jotOpen?" open":""}><summary>Paste a submitted Jotform</summary>
    <p class="small muted">Open the submission in Jotform (or the notification email), select all of it, copy, and paste here. Matching answers fill in below; answers already in this form are kept unless the paste has something new.</p>
    <textarea id="jot-text" class="small" style="min-height:120px" placeholder="Paste the whole submission here"></textarea>
    <div class="row"><button type="button" class="primary" data-act="jotfill" data-kind="${kind}">Fill in this form</button></div>
    <div id="jot-report"></div></details>`;
}

  return `<div class="notice ${r.count?"ok":"warn"}"><b>${r.count} of ${r.total} answers filled in.</b>${r.odd.length?` These didn't match a choice, so add them by hand:<ul style="margin:6px 0 0;padding-left:18px">${r.odd.map(([l,v])=>`<li><b>${esc(l)}</b>: ${esc(v)}</li>`).join("")}</ul>`:""}${r.count?"":" Check that you copied the whole submission, and that the form's questions use the exact wording from your setup guide."}</div>`;
}

function pdfSafe(t){ return String(t||"").replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...").replace(/\u00bd/g,"1/2").replace(/[^\x00-\xFF]/g,""); }

async function planPdf(p, clientLabel){
  const {jsPDF}=await loadJsPDF(); const doc=new jsPDF({unit:"pt",format:"letter"});

  const font=(style,size,color)=>{ doc.setFont(style[0],style[1]); doc.setFontSize(size); doc.setTextColor(...color); };
  const wrap=(t,w,style,size)=>{ doc.setFont(style[0],style[1]); doc.setFontSize(size); return doc.splitTextToSize(pdfSafe(t), w); };
  const SANS=["helvetica","normal"], SANSB=["helvetica","bold"], SANSI=["helvetica","italic"], SERIF=["times","bold"], SERIFI=["times","italic"];
  let y=0;

    if(first){

      font(SANSB,8.5,hdr2); doc.setCharSpace(1.6); doc.text("TREATMENT PLAN", W-M, 40, {align:"right"}); doc.setCharSpace(0);
      font(SANSB,13,hdr); doc.text(pdfSafe(clientLabel||""), W-M, 59, {align:"right"});
      font(SANS,10,hdr2); doc.text(pdfSafe(fmtDate(p.date)||""), W-M, 75, {align:"right"});
      y=140;
      const t=(p.title||"").trim();
      if(t && !/^(remedy|treatment) plan$/i.test(t)){ const ls=wrap(t,CW,SERIF,17); font(SERIF,17,deep); ls.forEach(l=>{ doc.text(l,M,y); y+=21; }); y+=6; }
    } else {
      doc.setFillColor(...aqua); doc.rect(0,0,W,6,"F");
      font(SERIF,11,teal); doc.text("Wellness From Within", M, 34);

    doc.setFillColor(...teal); doc.circle(M+PAD+BADGE/2, top+PAD+BADGE/2, BADGE/2, "F");
    font(SANSB,12,[255,255,255]); doc.text(String(i+1), M+PAD+BADGE/2, top+PAD+BADGE/2+4.3, {align:"center"});

    rems.forEach(ls=>{ doc.setFillColor(...teal); doc.circle(IX+3, cy-3.6, 1.9, "F"); font(SANS,11,ink); ls.forEach(l=>{ doc.text(l,IX+14,cy); cy+=14.5; }); cy+=3; });

      const col2=IX+IW/2+6;

    font(SANS,7.5,muted); doc.text("Homeopathy and flower essences are complementary approaches and do not replace care from your medical provider.", W/2, fy+28, {align:"center"});
    doc.text(`Page ${i} of ${n}`, W-M, fy+40, {align:"right"});
  }
  return doc.output("blob");
}

function fmtAnswer(f, v){

  if(f.type==="scale") return `${v} out of 10`;
  if(Array.isArray(v)) return v.join(", ");

async function formPdf(def, vals, {kind, who, date, photo}){
  const {jsPDF}=await loadJsPDF(); const doc=new jsPDF({unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=50, CW=W-2*M, FOOT=64;
  const aqua=[117,227,235], teal=[11,120,145], deep=[19,66,74], ink=[33,47,51], muted=[98,118,123], line=[203,231,234], hdr=[15,51,58], hdr2=[22,86,96];
  const SANS=["helvetica","normal"], SANSB=["helvetica","bold"], SERIF=["times","bold"], SERIFI=["times","italic"];
  const font=(st,sz,c)=>{ doc.setFont(st[0],st[1]); doc.setFontSize(sz); doc.setTextColor(...c); };
  const wrap=(t,w,st,sz)=>{ doc.setFont(st[0],st[1]); doc.setFontSize(sz); return doc.splitTextToSize(pdfSafe(t), w); };
  let y=0;
  const header=first=>{
    if(first){
      doc.setFillColor(...aqua); doc.rect(0,0,W,96,"F"); doc.setFillColor(...teal); doc.rect(0,96,W,3,"F");
      font(SERIF,23,hdr); doc.text("Wellness From Within", M, 46);
      font(SERIFI,12,hdr2); doc.text(pdfSafe(PRACTICE.name), M, 66);
      font(SANSB,8.5,hdr2); doc.setCharSpace(1.6); doc.text(pdfSafe(kind.toUpperCase()), W-M, 38, {align:"right"}); doc.setCharSpace(0);
      font(SANSB,13,hdr); doc.text(pdfSafe(who||""), W-M, 56, {align:"right"});
      font(SANS,9.5,hdr2); doc.text(pdfSafe(date?`Submitted ${fmtDate(date)}`:""), W-M, 71, {align:"right"});
      y=126;
    } else {
      doc.setFillColor(...aqua); doc.rect(0,0,W,6,"F");
      font(SERIF,11,teal); doc.text("Wellness From Within", M, 34);
      font(SANS,9,muted); doc.text(pdfSafe([who, kind].filter(Boolean).join("  |  ")), W-M, 34, {align:"right"});
      doc.setDrawColor(...line); doc.setLineWidth(0.75); doc.line(M,44,W-M,44); y=66;
    }
  };
  const room=h=>{ if(y+h>H-FOOT){ doc.addPage(); header(false); } };
  header(true);
  const sections=def.map(s=>({sec:s.sec, rows:s.fields.map(f=>({f, a:fmtAnswer(f, vals[f.id])})).filter(r=>r.a)})).filter(s=>s.rows.length);
  if(vals.photoOnFile) sections.unshift({sec:"Photo", rows:[{f:{label:"Photo",type:"text"}, a:"Returning client: use the photo already on file"}]});
  const drawSection=(s, x, w)=>{
    room(46);
    font(SERIF,13.5,deep); doc.text(pdfSafe(s.sec), x, y); y+=7;
    doc.setDrawColor(...aqua); doc.setLineWidth(1.4); doc.line(x,y,x+w,y); y+=16;
    const LW=Math.round(w*0.36), VX=x+LW+12, VW=w-LW-12;
    s.rows.forEach(({f,a})=>{
      const stacked = f.type==="textarea" || f.type==="check" || f.type==="multi" || f.label.length>70;
      const lab=wrap(f.label, stacked?w:LW, SANSB, 8.8);
      const val=wrap(a, stacked?w:VW, SANS, 10.5);
      const h = stacked ? lab.length*11.5+4+val.length*14 : Math.max(lab.length*11.5, val.length*14);
      room(h+12);
      font(SANSB,8.8,muted); lab.forEach((l,i)=>doc.text(l, x, y+i*11.5));
      font(SANS,10.5,ink);
      if(stacked){ const vy=y+lab.length*11.5+4; val.forEach((l,i)=>doc.text(l, x, vy+i*14+1)); }
      else val.forEach((l,i)=>doc.text(l, VX, y+i*14+1));
      y+=h+4; doc.setDrawColor(...line); doc.setLineWidth(0.5); doc.line(x,y,x+w,y); y+=12;
    });
    y+=8;
  };
  let rest=sections;
  if(photo){
    const PW=150; let ph=PW;
    try{ const pr=doc.getImageProperties(photo); ph=Math.min(200, PW*pr.height/pr.width); }catch(e){}
    const top=y;
    doc.setDrawColor(...line); doc.setLineWidth(0.9); doc.roundedRect(M-1,top-1,PW+2,ph+2,4,4,"S");
    try{ doc.addImage(photo, "JPEG", M, top, PW, ph); }catch(e){}
    font(SANS,8,muted); doc.text("Client photo", M, top+ph+13);
    if(sections.length){ const save=y; drawSection(sections[0], M+PW+24, CW-PW-24); rest=sections.slice(1); y=Math.max(y, top+ph+30); }
    else y=top+ph+30;
  }
  rest.forEach(s=>drawSection(s, M, CW));
  if(!sections.length){ font(SANS,11,muted); doc.text("No answers saved yet.", M, y); }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); const fy=H-FOOT+18;
    doc.setDrawColor(...line); doc.setLineWidth(0.75); doc.line(M,fy,W-M,fy);
    font(SANSB,8.5,teal); doc.text(pdfSafe(`${PRACTICE.name}   |   ${PRACTICE.phone}   |   ${PRACTICE.email}   |   ${PRACTICE.site}`), W/2, fy+15, {align:"center"});
    font(SANS,7.5,muted); doc.text("Confidential client information", M, fy+30); doc.text(`Page ${i} of ${n}`, W-M, fy+30, {align:"right"});
  }
  return doc.output("blob");
}

async function fillForm(url, fields){
  const L=await loadPdfLib(); const bytes=await (await fetch(url)).arrayBuffer();
  const pdf=await L.PDFDocument.load(bytes); const form=pdf.getForm(); const missing=[];
  for(const [name,kind,v] of fields){
    try{
      if(kind==="c"){ const f=form.getCheckBox(name); v ? f.check() : f.uncheck(); }
      else if(kind==="d"){ const f=form.getDropdown(name); f.select(v ? pdfSafe(v) : " "); }
      else form.getTextField(name).setText(v ? pdfSafe(v) : "");
    }catch(e){ missing.push(name); }
  }
  if(missing.length) console.warn("PDF fields not filled:", missing);
  return new Blob([await pdf.save()], {type:"application/pdf"});
}

const QEST_ANON = [{sec:"About the client", fields:[{id:"age",label:"Age",type:"text"},{id:"firstScan",label:"First scan with Dawn?",type:"text"}]}, ...QEST.slice(1).map(sec=>({...sec, fields:sec.fields.filter(f=>!["signature","sigDate"].includes(f.id))}))];

async function uploadScanCsv(file){
  const sc=S.scan; if(!file) return; const st=$("#scan-csv-st");

  if(st) st.textContent="Uploading…";

  const old=sc.data.csv; readScanForm(); sc.data.csv={name:file.name, path, size:file.size, uploadedAt:new Date().toISOString()};

function hl(text, terms){

const PLAIN_MOD = { worse:"agg", aggravated:"agg", aggravates:"agg", worsens:"agg", worsened:"agg", agg:"agg", better:"amel", relieved:"amel", improved:"amel", improves:"amel", eases:"amel", eased:"amel", helps:"amel", amel:"amel", relief:"amel" };
const PLAIN_WEAK = new Set(["after","before","during","while","from","since","until"]);
let PLAIN = null;
function plainNorm(s){ return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function plainStem(w){ if(w.length>5 && w.endsWith("ing")) return w.slice(0,-3); if(w.length>4 && w.endsWith("ed")) return w.slice(0,-2); if(w.length>4 && w.endsWith("es") && !w.endsWith("ses")) return w.slice(0,-2); if(w.length>3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0,-1); return w; }
function plainInit(){
  if(PLAIN) return PLAIN;
  const map=new Map(); let maxN=1;
  PLAIN_DICT.trim().split("\n").forEach(line=>{
    const [l,r]=line.split("=>"); if(!r) return;
    const alts=r.split("/").map(a=>a.trim().split(/\s+/).filter(Boolean));
    l.split(",").map(x=>plainNorm(x)).filter(Boolean).forEach(k=>{ map.set(k,alts); maxN=Math.max(maxN,k.split(" ").length); });
  });
  PLAIN={map,maxN}; return PLAIN;
}
/* turn a plain-language query into concepts: {label, alts:[[tok..]..], w, mod} */
function plainParse(q){
  const {map,maxN}=plainInit();
  const words=plainNorm(q).split(" ").filter(Boolean); const out=[];
  for(let i=0;i<words.length;){
    let hit=null;
    for(let n=Math.min(maxN,words.length-i);n>=1;n--){ const k=words.slice(i,i+n).join(" "); if(map.has(k)){ hit={k,n}; break; } }
    if(hit){ out.push({label:hit.k, alts:map.get(hit.k), w:1}); i+=hit.n; continue; }
    const w=words[i]; i++;
    if(PLAIN_MOD[w]){ const m=PLAIN_MOD[w]; out.push({label:w, alts:[[m]], w:m==="agg"?0.3:1, mod:m}); continue; }
    if(PLAIN_STOP.has(w) || w.length<3) continue;
    if(PLAIN_WEAK.has(w)){ out.push({label:w, alts:[[w]], w:0.3}); continue; }
    const st=plainStem(w); out.push({label:w, alts:st!==w?[[st]]:[[w]], w:1});
  }
  return out;
}
function plainText(i){ // cached normalized rubric with word boundaries
  if(!R.norm) R.norm = R.rep.rubrics.map(r=>" "+r[0].toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ");
  return R.norm[i];
}
function plainSearch(q, chap){
  const cons=plainParse(q); if(!cons.length) return {cons, list:[], full:0};
  const strong=cons.filter(c=>c.w>=1).length || cons.length;
  const total=cons.reduce((a,c)=>a+c.w,0);
  const hasMod=cons.find(c=>c.mod);
  const chapPref = chap ? chap.toLowerCase()+"," : null;
  const L=R.lower; const res=[]; const cnt=new Array(cons.length).fill(0);
  plainText(0);
  for(let i=0;i<L.length;i++){
    if(chapPref && !L[i].startsWith(chapPref) && L[i]!==chap.toLowerCase()) continue;
    const s=R.norm[i]; let mask=0;
    for(let c=0;c<cons.length;c++){ if(cons[c].alts.some(a=>a.every(t=>s.includes(" "+t)))){ mask|=(1<<c); cnt[c]++; } }
    if(mask) res.push([i,mask]);
  }
  const N=L.length; const wt=cons.map((c,k)=>c.w*(1+Math.log10(N/Math.max(1,cnt[k]))/3));
  const out=[];
  for(const [i,mask] of res){ let sc=0, strongHit=0;
    for(let c=0;c<cons.length;c++) if(mask&(1<<c)){ sc+=wt[c]; if(cons[c].w>=1) strongHit++; }
    if(!strongHit) continue;
    if(hasMod){ const opp=hasMod.mod==="agg"?" amel":" agg"; if(R.norm[i].includes(opp)) sc-=0.8; }
    out.push([i, sc, strongHit, L[i].split(",").length]);
  }
  res.length=0; res.push(...out);
  const need=Math.min(strong, Math.max(1, strong>=3 ? strong-1 : strong));
  let list=res.filter(r=>r[2]>=need);
  if(!list.length) list=res.filter(r=>r[2]>=Math.max(1,strong-1));
  if(!list.length) list=res;
  list.sort((a,b)=> (b[2]-a[2]) || (b[1]-a[1]) || (a[3]-b[3]) || (a[0]-b[0]));
  const full=list.filter(r=>r[2]>=strong).length;
  return {cons, list:list.map(r=>r[0]), full, strong, scores:new Map(list.map(r=>[r[0],r[2]]))};
}

function repertorize(){

    parseLinks(R.rep.rubrics[i][1]).forEach(([rem,g])=>{

      if(!cells.has(rem)) cells.set(rem,{}); cells.get(rem)[ci]=g;

/* ---------- mention index (which notes mention which remedy) ---------- */
function ensureAliases(){
  if(R.aliasMap) return;
  const m=new Map(); R.rep.remedies.forEach((r,i)=>(r[2]||[]).forEach(a=>{ if(!m.has(a)) m.set(a,i); })); R.aliasMap=m;
}
/* word-by-word scan: try 3, 2, then 1 word phrases against the alias table */
function findMentions(text){
  ensureAliases();
  const toks=[]; const re=/[A-Za-z]+/g; let m; while((m=re.exec(text))) toks.push([m.index, m.index+m[0].length, m[0]]);
  const out=[];
  for(let i=0;i<toks.length;i++){
    for(let n=3;n>=1;n--){
      if(i+n>toks.length) continue;
      if(n>1 && /[^\s.\-]/.test(text.slice(toks[i+n-2][1], toks[i+n-1][0]))) continue;
      const key=toks.slice(i,i+n).map(t=>t[2].toLowerCase()).join(" ");
      const rem=R.aliasMap.get(key); if(rem==null) continue;
      if(n===1 && key.length<=4 && toks[i][2][0]!==toks[i][2][0].toUpperCase()) continue;
      out.push({start:toks[i][0], end:toks[i+n-1][1], rem}); i+=n-1; break;
    }
  }
  return out;
}
function buildIndex(){
  if(R.idx || !R.rep || !R.books || !S.libLoaded) return R.idx;
  const idx=new Map(); const add=(rem,key)=>{ if(!idx.has(rem)) idx.set(rem,new Set()); idx.get(rem).add(key); };
  const scan=(text,key)=>findMentions(text).forEach(x=>add(x.rem,key));
  R.books.es.forEach((p,i)=>scan(p,"es:"+i));
  R.books.nar.mixes.forEach((m,i)=>scan(m.name+" "+m.text,"nm:"+i));
  R.books.notes.forEach((d,di)=>d.paras.forEach((p,pi)=>scan(p,"nt:"+di+":"+pi)));
  allEntries().forEach(e=>scan(e.title+" "+(e.blocks||[]).map(b=>b.x).join(" "),"pr:"+e.id));
  S.combos.forEach((c,i)=>scan(c.remedies.replace(/\//g," / "),"cb:"+i));
  R.idx=idx; return idx;
}
function highlightRem(text, rem){
  const ms=findMentions(text).filter(x=>x.rem===rem); let out="", pos=0;
  ms.forEach(x=>{ out+=esc(text.slice(pos,x.start))+"<mark>"+esc(text.slice(x.start,x.end))+"</mark>"; pos=x.end; });
  return out+esc(text.slice(pos));
}

/* ---------- Notes: one search across everything you've written or saved ---------- */
function noteSources(){
  const b=R.books; if(!b) return [];
  const src=[];
  b.notes.forEach(d=>src.push({title:d.title, paras:d.paras}));
  if(b.es.length) src.push({title:"Extra Strength Homeopathy (your notes)", paras:b.es});
  b.gbot.forEach(g=>src.push({title:"Getting Back on Track: "+g.remedy, paras:g.text.split("\n").filter(Boolean)}));
  if(b.nar.mixes.length) src.push({title:"Narayani remedies", paras:b.nar.mixes.map(m=>titleCase(m.name)+" "+m.potency+" ("+m.code+")\n"+m.text)});
  b.nar.sections.forEach(s2=>src.push({title:"Narayani: "+s2.title, paras:s2.text.split("\n").filter(Boolean)}));
  const sh={}; S.lib.filter(e=>e.source.startsWith("Class sheets")).forEach(e=>{ (sh[e.source]=sh[e.source]||[]).push(e.title+"\n"+(e.blocks||[]).map(x=>x.k==="l"?"Line "+x.n+": "+x.x:x.x).join("\n")); });
  Object.keys(sh).forEach(k=>src.push({title:k, paras:sh[k]}));
  return src;
}

  let t; $("#ntq").oninput=e=>{ clearTimeout(t); t=setTimeout(()=>{ R.ntq=e.target.value; R.ntShown=60; R.ntOpen=null; renderNoteResults(); },150); };

    const o=e.target.closest("[data-ntopen]"); if(o){ R.ntBackY=window.scrollY; R.ntOpen={title:o.dataset.ntopen, pi:+o.dataset.pi}; renderNoteResults(); return; }
    const rd=e.target.closest("[data-ntread]"); if(rd){ R.ntBackY=window.scrollY; R.ntOpen={title:rd.dataset.ntread, pi:-1}; renderNoteResults(); window.scrollTo(0,0); return; }

function renderNoteResults(){
  const el=$("#ntResults"); if(!el||!R.books) return;
  const all=noteSources();
  const terms=R.ntq.toLowerCase().split(/\s+/).filter(Boolean);
  if(R.ntOpen){
    const src=all.find(x=>x.title===R.ntOpen.title);
    if(src){
      const nhits=terms.length?src.paras.filter(p=>terms.every(t=>p.toLowerCase().includes(t))).length:0;
      el.innerHTML=`<div class="sheet stack">
        <div class="row" style="position:sticky;top:0;background:var(--surface,var(--bg));z-index:2;padding:6px 0;border-bottom:1px solid var(--line)">
          <button type="button" class="ghost" data-ntback="1">← Back to results</button>

        <div><p class="label">Reading the whole source</p><h2>${esc(src.title)}</h2></div>
        ${src.paras.map((p,i)=>{ const hit=terms.length&&terms.every(t=>p.toLowerCase().includes(t)); return `<p id="np-${i}" class="mmtext note-para" style="white-space:pre-wrap;${hit?"border-left:3px solid var(--accent);padding-left:10px;":""}${i===R.ntOpen.pi?"background:var(--soft);border-radius:6px;padding:8px 10px;":""}">${hl(p,terms)}</p>`; }).join("")}
        <div class="row"><button type="button" class="ghost" data-ntback="1">← Back to results</button></div></div>`;
      const tgt=document.getElementById("np-"+R.ntOpen.pi); if(tgt) setTimeout(()=>tgt.scrollIntoView({block:"center"}),0); else window.scrollTo(0,0);
      return;
    }
    R.ntOpen=null;
  }
  const srcs=all.filter(x=>!R.ntDoc||x.title===R.ntDoc);
  if(!terms.length && !R.ntDoc){
    el.innerHTML=`<div class="sheet stack"><p class="muted">Search across ${srcs.length} sources at once: your Substack articles, Extra Strength and Getting Back on Track notes, the Banerji articles, flower essences, Narayani, your eight class sheets and more. Every word must appear in the same paragraph. Tap any source below to read it from the top.</p>
      <ul class="small" style="margin:0;padding-left:18px;columns:2 260px;line-height:1.7">${srcs.map(x=>`<li><button type="button" class="linkish" data-ntread="${esc(x.title)}">${esc(x.title)}</button> <span class="muted">(${x.paras.length})</span></li>`).join("")}</ul></div>`; return; }
  const hits=[]; srcs.forEach(x=>x.paras.forEach((p,pi)=>{ const l=p.toLowerCase(); if(terms.every(t=>l.includes(t))) hits.push([x.title,p,pi]); }));
  const shown=hits.slice(0,R.ntShown||60); let last="";
  el.innerHTML = `<p class="small muted" style="margin:0 4px 8px">${hits.length} paragraph${hits.length===1?"":"s"}${R.ntDoc?` in ${esc(R.ntDoc)}`:""}</p><div class="sheet stack">${shown.map(([t,p,pi])=>{ const h=t!==last?`<div class="row" style="margin-top:8px"><p class="label grow" style="margin:0">${esc(t)}</p><button type="button" class="ghost small" data-ntread="${esc(t)}">Read whole source</button></div>`:""; last=t; return h+`<p class="mmtext note-para" style="white-space:pre-wrap">${hl(p,terms)}</p><div class="row" style="margin-top:-4px"><button type="button" class="linkish small" data-ntopen="${esc(t)}" data-pi="${pi}">Open in source ›</button></div>`; }).join("") || `<p class="muted">Nothing found. Try fewer or different words.</p>`}</div>
    ${hits.length>shown.length?`<div class="row" style="justify-content:center;margin-top:10px"><button type="button" data-ntmore="1">Show more</button></div>`:""}`;
}

    const denied = S.clientWrite==="denied"?`<div class="notice">Your portal access lets you view your plans but not save forms here. Please email your answers and photo to ${esc(PRACTICE.email)}, or ask Dawn for Contributor access.</div>`:"";
    const seg = `<div class="seg" role="tablist" aria-label="Which form">
      <button type="button" role="tab" data-form="qest" aria-current="${S.form==="qest"}">Qest4 pre-scan form${qestIn?" ✓":""}</button>
      <button type="button" role="tab" data-form="homeo" aria-current="${S.form==="homeo"}">Homeopathy intake${homeoIn?" ✓":""}</button>
      <button type="button" role="tab" data-form="followup" aria-current="${S.form==="followup"}">Homeopathy follow-up</button></div>`;
    if(S.form==="qest"){
      body = `${seg}<div class="sheet stack">
        <div><h2>Pre-scan wellness form</h2><p class="small muted">Please complete before your Qest4 scan. Everything you share is confidential.</p></div>
        ${denied}
        ${qestIn && !S.myRec?.qestDraft && !S.qestNew ? `<div class="notice ok"><b>Thank you! Your pre-scan form was sent${S.myRec?.qestSubmittedAt?" on "+esc(fmtDate(S.myRec.qestSubmittedAt)):""}.</b> Dawn has everything she needs for this scan.</div>
          <div class="row"><button type="button" class="primary" data-act="qnew">Start a new form for my next scan</button></div>
          <p class="small muted">Only start a new form when Dawn has scheduled your next scan. Your contact details carry over, so you only answer the questions about how you are now.</p>` : `
        ${qestIn ? `<div class="notice">${S.myRec?.qestDraft?"You've started your form for your next scan. Pick up where you left off.":"New form for your next scan. Your details are filled in; please answer the rest for how you are now."}</div>` : ""}
        ${photoBlock("cp", S.myPhoto, true, true)}
        <label class="check" style="margin-top:-4px"><input type="checkbox" id="cs-photoOnFile" ${S.myRec?.qest?.photoOnFile?"checked":""}><span>I'm a returning client. Please use the photo Dawn already has on file.</span></label>
        ${intakeForm(qestIn ? (S.myRec?.qestDraft || qestCarry(S.myRec?.qest)) : (S.myRec?.qest||{}), "cs", false, QEST)}
        <div class="row"><button type="button" data-act="qdraft">Save and finish later</button><button type="button" class="primary" data-act="qsubmit">Send to Dawn</button></div>`}
      </div>`;
    } else if(S.form==="followup"){
      const lastFu=(S.myRec?.followupHistory||[]).slice(-1)[0];
      body = `${seg}<div class="sheet stack">
        <div><h2>Homeopathy follow-up</h2><p class="small muted">A quick update before your follow-up session. Only you and Dawn can see your answers.</p></div>
        ${lastFu?`<div class="notice ok">Your last follow-up was sent ${esc(fmtDate(lastFu.submittedAt))}. Thank you! Before your next visit, fill this in again with how you are now.</div>`:""}
        ${denied}
        ${intakeForm(S.myRec?.followup||{fullName:S.myRec?.intake?.fullName||S.myRec?.qest?.fullName||""}, "cf", false, FOLLOWUP)}
        <div class="row"><button type="button" data-act="fdraft">Save and finish later</button><button type="button" class="primary" data-act="fsubmit">Send to Dawn</button></div>
      </div>`;
    } else {
      body = `${seg}<div class="sheet stack">
        <div><h2>Homeopathy intake</h2><p class="small muted">Take your time. Save as you go and come back later. Only you and Dawn can see your answers.</p></div>
        ${homeoIn?`<div class="notice ok">Your intake is in. You can still update it before your session.</div>`:""}
        ${denied}
        ${intakeForm(S.myRec?.intake||{}, "ci")}
        <div class="row"><button type="button" data-act="cdraft">Save and finish later</button><button type="button" class="primary" data-act="csubmit">Send to Dawn</button></div>
      </div>`;
    }
  }
  $("#app").innerHTML = `<div class="stack" style="max-width:820px;margin:0 auto">
    <div><p class="label">Wellness From Within</p><h1>${first?`Hello, ${esc(first)}`:"Welcome"}</h1></div>
    ${body}
    <div class="sheet stack"><h3>Questions?</h3>${contactBlock()}</div>
  </div>`;
  bindPhoto("cp", () => S.me);
  $("#app").onclick = async e => {
    const fo=e.target.closest("[data-fopen]"); if(fo){ const f=(S.myFiles||[]).find(x=>x.id===fo.dataset.fopen); if(f) openClientFile(f); return; }
    const cp=e.target.closest("[data-cplanpdf]"); if(cp){ const p=(S.myPlans||[]).find(x=>x.id===cp.dataset.cplanpdf); if(!p) return; const nm=S.myRec?.intake?.fullName||S.myRec?.qest?.fullName||S.myRec?.followup?.fullName||S.myRec?.name||"";
      cp.disabled=true; cp.textContent="Making PDF…"; try{ saveBlob(await planPdf(p, nm), `Treatment plan${nm?" - "+nm:""} - ${p.date||today()}.pdf`); }catch(e1){ toast("Couldn't make the PDF. Check your connection and try again."); } cp.disabled=false; cp.textContent="Download PDF"; return; }
    const c2=e.target.closest("[data-cv2]"); if(c2){ S.cview=c2.dataset.cv2; renderClient(); return; }
    const fm=e.target.closest("[data-form]"); if(fm){ S.form=fm.dataset.form; renderClient(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    const act=a.dataset.act;
    if(act==="qnew"){ S.qestNew=true; renderClient(); window.scrollTo(0,0); return; }
    if(!["cdraft","csubmit","qdraft","qsubmit","fdraft","fsubmit"].includes(act)) return;
    const isQ = act[0]==="q", isF = act[0]==="f", submit = act.endsWith("submit");
    const def = isQ ? QEST : isF ? FOLLOWUP : INTAKE, pre = isQ ? "cs" : isF ? "cf" : "ci";
    const vals = readIntake(pre, def);
    if(submit){
      const miss = def.flatMap(s=>s.fields).filter(f=>f.req && !vals[f.id]);
      if(isQ) vals.photoOnFile = !!document.getElementById("cs-photoOnFile")?.checked || undefined;
      if(isQ && !S.myPhoto && !vals.photoOnFile){ toast("Please add a recent photo of yourself, or tick the box to use the photo on file"); document.querySelector('label[for="cp-photo"]')?.scrollIntoView({block:"center"}); return; }
      if(miss.length){ toast(miss.some(f=>f.type==="check") ? "Please check the acknowledgement and sign at the end" : `Please fill in: ${miss.map(f=>f.label).join(", ")}`); const el=document.getElementById(pre+"-"+miss[0].id); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } return; }
    }
    a.disabled=true;
    const now=new Date().toISOString();
    const key = isQ ? "qest" : isF ? "followup" : "intake", stKey = key + "Status";
    let patch = {[key]:vals, [stKey]: submit ? "submitted" : (S.myRec?.[stKey]==="submitted" ? "submitted" : "draft"), [key+"UpdatedAt"]:now};
    if(isQ && !submit && S.myRec?.qestStatus==="submitted") patch = {qestDraft:vals, qestUpdatedAt:now};
    if(isQ && submit){ patch.qestDraft = null; S.qestNew = false; }
    if(isF && submit) patch.followup = {fullName: vals.fullName||""};
    if(submit) patch[key+"SubmittedAt"] = now;
    if(isF && submit) patch.followupHistory = [...(S.myRec?.followupHistory||[]), {form:vals, submittedAt:now}].slice(-60);
    try{
      if(S.myRec) await S.db.doc("clients/"+S.me).update(patch);
      else await S.db.doc("clients/"+S.me).set({...patch, createdAt:now, source:"portal"});
      if(isQ && submit) await S.db.collection(`clients/${S.me}/qestForms`).doc().set({form:vals, submittedAt:now});
      S.myRec = {...(S.myRec||{}), ...patch}; if(S.myRec.qestDraft===null) delete S.myRec.qestDraft;
      S.clientWrite="ok"; toast(submit?"Sent to Dawn. Thank you!":"Saved");
      if(submit) S.cview="plans";
      renderClient(); window.scrollTo(0,0);
    }catch(err){ console.warn(err); a.disabled=false; if(err?.code==="invalid_argument"){ S.clientWrite="denied"; renderClient(); window.scrollTo(0,0); } else toast("That didn't save. Check your connection and try again."); }
  };
}
function planCard(p){
  return `<article class="sheet planview">
    <div class="row" style="align-items:flex-start"><div class="grow"><p class="label">${esc(fmtDate(p.date))}</p><h2>${esc(!p.title||/^remedy plan$/i.test(p.title)?"Treatment plan":p.title)}</h2></div><button type="button" data-cplanpdf="${esc(p.id||"")}">Download PDF</button></div>
    ${(p.bottles||[]).map((b,i)=>`<div class="bottle">
      <div class="bottle-head"><span class="bottle-num">Bottle ${i+1}</span><h3 class="grow">${esc(b.issue||"")}</h3></div>
      ${b.remedies?`<ul class="rxlist">${remedyLines(b.remedies).map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
      <div class="grid2">
        ${b.freq?`<div><p class="label">How often</p><p class="freq">${esc(plainFreq(b.freq)||b.freq)}${plainFreq(b.freq)?` <span class="mono muted">${esc(b.freq)}</span>`:""}</p></div>`:""}
        ${b.duration?`<div><p class="label">How long</p><p>${esc(b.duration)}</p></div>`:""}
      </div>
      ${b.notes?`<p class="small">${esc(b.notes)}</p>`:""}
    </div>`).join("")}
    ${cleanInstr(p.instructions)?`<div><p class="label">How to take your remedies</p><p style="white-space:pre-wrap">${esc(cleanInstr(p.instructions))}</p></div>`:""}
  </article>`;
}
function contactBlock(){
  return `<div class="contact"><span>${esc(PRACTICE.name)}</span><span>${esc(PRACTICE.phone)}</span><span>${esc(PRACTICE.email)}</span><a href="https://${PRACTICE.site}" target="_blank" rel="noopener">${esc(PRACTICE.site)}</a></div>`;
}
</script>
</body>
