}
/* turn a plain-language query into concepts: {label, alts:[[tok..]..], w, mod} */
function plainParse(q){
  const {map,maxN}=plainInit();
  const words=plainNorm(q).split(" ").filter(Boolean); const out=[];
  for(let i=0;i<words.length;){
    let hit=null;
    for(let n=Math.min(maxN,words.length-i);n>=1;n--){ const k=words.slice(i,i+n).join(" "); if(map.has(k)){ hit={k,n}; break; } }
    if(hit){ out.push({label:hit.k, alts:map.get(hit.k), w:1, raw:hit.k.split(" ").filter(x=>!PLAIN_STOP.has(x)).map(plainStem)}); i+=hit.n; continue; }
    const w=words[i]; i++;
    if(PLAIN_MOD[w]){ const m=PLAIN_MOD[w]; out.push({label:w, alts:[[m]], w:m==="agg"?0.3:1, mod:m}); continue; }
    if(PLAIN_STOP.has(w) || w.length<3) continue;
    if(PLAIN_WEAK.has(w)){ out.push({label:w, alts:[[w]], w:0.3}); continue; }
    const st=plainStem(w); out.push({label:w, alts:st!==w?[[st]]:[[w]], w:1});
  }

}

function plainSearch(q, chap){
  const cons=plainParse(q); if(!cons.length) return {cons, list:[], full:0};
  const strong=cons.filter(c=>c.w>=1).length || cons.length;
  const total=cons.reduce((a,c)=>a+c.w,0);
  const hasMod=cons.find(c=>c.mod);
  const chapPref = chap ? chap.toLowerCase()+"," : null;
  const L=R.lower; const res=[]; const cnt=new Array(cons.length).fill(0);
  plainText(0);
  for(let i=0;i<L.length;i++){
    if(!repSrcOK(i)) continue;
    if(chapPref && !L[i].startsWith(chapPref) && L[i]!==chap.toLowerCase()) continue;
    const s=R.norm[i]; let mask=0; const g=isG(i);
    for(let c=0;c<cons.length;c++){ if(cons[c].alts.some(a=>a.every(t=>s.includes(" "+t))) || (g && cons[c].raw && cons[c].raw.every(t=>s.includes(" "+t)))){ mask|=(1<<c); cnt[c]++; } }
    if(mask) res.push([i,mask]);

  for(const [i,mask] of res){ let sc=0, strongHit=0;

    if(!strongHit) continue;
    if(hasMod){ const opp=hasMod.mod==="agg"?" amel":" agg"; if(R.norm[i].includes(opp)) sc-=0.8; }
    out.push([i, sc, strongHit, L[i].split(",").length]);
  }
  res.length=0; res.push(...out);
  const need=Math.min(strong, Math.max(1, strong>=3 ? strong-1 : strong));
  let list=res.filter(r=>r[2]>=need);
  if(!list.length) list=res.filter(r=>r[2]>=Math.max(1,strong-1));
  if(!list.length) list=res;
  list.sort((a,b)=> (b[2]-a[2]) || (b[1]-a[1]) || (a[3]-b[3]) || (a[0]-b[0]));
  const full=list.filter(r=>r[2]>=strong).length;
  return {cons, list:list.map(r=>r[0]), full, strong, scores:new Map(list.map(r=>[r[0],r[2]]))};
}

/* ---------- mention index (which notes mention which remedy) ---------- */
function ensureAliases(){
  if(R.aliasMap) return;
  const m=new Map(); R.rep.remedies.forEach((r,i)=>(r[2]||[]).forEach(a=>{ if(!m.has(a)) m.set(a,i); })); R.aliasMap=m;
}
/* word-by-word scan: try 3, 2, then 1 word phrases against the alias table */
function findMentions(text){
  ensureAliases();
  const toks=[]; const re=/[A-Za-z]+/g; let m; while((m=re.exec(text))) toks.push([m.index, m.index+m[0].length, m[0]]);
  const out=[];
  for(let i=0;i<toks.length;i++){
    for(let n=3;n>=1;n--){
      if(i+n>toks.length) continue;
      if(n>1 && /[^\s.\-]/.test(text.slice(toks[i+n-2][1], toks[i+n-1][0]))) continue;
      const key=toks.slice(i,i+n).map(t=>t[2].toLowerCase()).join(" ");
      const rem=R.aliasMap.get(key); if(rem==null) continue;
      if(n===1 && key.length<=4 && toks[i][2][0]!==toks[i][2][0].toUpperCase()) continue;
      out.push({start:toks[i][0], end:toks[i+n-1][1], rem}); i+=n-1; break;
    }
  }
  return out;
}
function buildIndex(){
  if(R.idx || !R.rep || !R.books || !S.libLoaded) return R.idx;
  const idx=new Map(); const add=(rem,key)=>{ if(!idx.has(rem)) idx.set(rem,new Set()); idx.get(rem).add(key); };
  const scan=(text,key)=>findMentions(text).forEach(x=>add(x.rem,key));
  R.books.es.forEach((p,i)=>scan(p,"es:"+i));
  R.books.nar.mixes.forEach((m,i)=>scan(m.name+" "+m.text,"nm:"+i));
  R.books.notes.forEach((d,di)=>d.paras.forEach((p,pi)=>scan(p,"nt:"+di+":"+pi)));
  allEntries().forEach(e=>scan(e.title+" "+(e.blocks||[]).map(b=>b.x).join(" "),"pr:"+e.id));
  S.combos.forEach((c,i)=>scan(c.remedies.replace(/\//g," / "),"cb:"+i));
  R.idx=idx; return idx;
}
function highlightRem(text, rem){
  const ms=findMentions(text).filter(x=>x.rem===rem); let out="", pos=0;
  ms.forEach(x=>{ out+=esc(text.slice(pos,x.start))+"<mark>"+esc(text.slice(x.start,x.end))+"</mark>"; pos=x.end; });
  return out+esc(text.slice(pos));
}

function griffithText(g, key){
  const P=g.paras||[]; const lim=R.mmMore[key]?Infinity:45;

  const rest=P.length>lim ? `<button type="button" class="ghost" data-more-mm="${key}">Show the rest (${P.length-lim} more paragraphs)</button>` : "";
  return body+rest+`<p class="small muted">From your copy of Colin Griffith's ${g.vol==="R"?"Comprehensive Repertory for the New Homeopathic Remedies":"New Materia Medica, Volume "+g.vol}. Only you can see this.</p>`;
}

/* ---------- Notes: one search across everything you've written or saved ---------- */
function noteSources(){
  const b=R.books; if(!b) return [];
  const src=[];
  b.notes.forEach(d=>src.push({title:d.title, paras:d.paras}));
  if(b.es.length) src.push({title:"Extra Strength Homeopathy (your notes)", paras:b.es});
  b.gbot.forEach(g=>src.push({title:"Getting Back on Track: "+g.remedy, paras:g.text.split("\n").filter(Boolean)}));
  if(b.nar.mixes.length) src.push({title:"Narayani remedies", paras:b.nar.mixes.map(m=>titleCase(m.name)+" "+m.potency+" ("+m.code+")\n"+m.text)});
  b.nar.sections.forEach(s2=>src.push({title:"Narayani: "+s2.title, paras:s2.text.split("\n").filter(Boolean)}));
  const sh={}; S.lib.filter(e=>e.source.startsWith("Class sheets")).forEach(e=>{ (sh[e.source]=sh[e.source]||[]).push(e.title+"\n"+(e.blocks||[]).map(x=>x.k==="l"?"Line "+x.n+": "+x.x:x.x).join("\n")); });
  Object.keys(sh).forEach(k=>src.push({title:k, paras:sh[k]}));
  return src;
}

function renderNoteResults(){
  const el=$("#ntResults"); if(!el||!R.books) return;

function startClient(){

  let h = (location.hash||"").toLowerCase();
  if(!/^#(qest|intake|followup|nextscan)$/.test(h)){ const w=recall("wfw.wantForm",null); if(w && Date.now()-w.t < 7*864e5) h=w.h; }
  if(S.me) store("wfw.wantForm", undefined);
  S.cviewAuto = !/^#(qest|intake|followup|nextscan)$/.test(h);
  S.cview = S.cviewAuto ? "home" : "forms";
  S.form = h==="#intake" ? "homeo" : h==="#followup" ? "followup" : "qest";
  S.wantNext = h==="#nextscan";

  if(!S.me){ renderClient(); return; }
  S.family = {}; S.familyLoaded = false;
  S.db.collection("clients").onSnapshot(s => {
    const m = {}; s.docs.forEach(d => { if(d.id===S.me || d.id.startsWith(S.me+"~")) m[d.id] = d.data(); });
    S.family = m; S.familyLoaded = true;

}

        <div class="row"><button type="button" data-act="fdraft">Save and finish later</button><button type="button" class="primary" data-act="fsubmit">Send to Dawn</button></div>
      </div>`;
    } else {
      body = `${seg}<div class="sheet stack">
        <div><h2>Homeopathy intake</h2><p class="small muted">Take your time. Save as you go and come back later. Only you and Dawn can see your answers.</p></div>
        ${homeoIn?`<div class="notice ok">Your intake is in. You can still update it before your session.</div>`:""}
        ${denied}
        ${intakeForm(S.myRec?.intake || (S.myRec?.name ? {fullName:S.myRec.name, email:S.myEmail} : {}), "ci")}
        <div class="row"><button type="button" data-act="cdraft">Save and finish later</button><button type="button" class="primary" data-act="csubmit">Send to Dawn</button></div>
      </div>`;
    }
  }
  $("#app").innerHTML = `<div class="stack client-main" style="max-width:${S.cview==="home"?1180:820}px;margin:0 auto">
    <div class="${S.cview==="home"?"dash-hello":""}">${S.cview==="home"?"":`<p class="label">Wellness From Within</p>`}<h1>${familyPeople().length>1 ? esc(name||"Unnamed") : first?`Hello, ${esc(first)}`:"Welcome"}</h1>${S.cview==="home"?`<p class="muted" style="font-size:17px;margin-top:4px">Here's everything for your wellness journey in one place.</p>`:""}</div>
    ${familyBar()}
    ${body}
    <details class="sheet" id="cpw-box" ontoggle="S.pwOpen=this.open" ${S.pwOpen?"open":""}><summary style="cursor:pointer"><b>Sign in with a password</b> <span class="small muted">(optional)</span></summary>
      <div class="stack" style="margin-top:10px">
        <p class="small muted">Tired of waiting for sign-in emails? Set a password here. Next time, choose <b>Use a password</b> on the sign-in page and enter ${esc(S.myEmail||"your email")} and this password. The email link still works any time, so if you forget your password, just use that.</p>
        <div class="row"><input id="cpw-new" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" aria-label="New password" style="flex:1 1 220px"><button type="button" data-act="csetpw">Save password</button></div>
      </div></details>
    <div class="sheet stack help-sheet"><h3>Questions?</h3>${contactBlock()}</div>
  </div>`;
  bindPhoto("cp", () => S.who);
  const cmb=$("#cmsg-box"); if(cmb){ msgScroll(); cmb.oninput=()=>{ S.cmsgDraft=cmb.value; }; }
  const fn=$("#fam-name"); if(fn){ fn.focus(); fn.onkeydown=e=>{ if(e.key==="Enter") document.querySelector('[data-act="famadd"]')?.click(); }; }
  $("#app").onclick = async e => {
    const fo=e.target.closest("[data-fopen]"); if(fo){ const f=(S.myFiles||[]).find(x=>x.id===fo.dataset.fopen); if(f) openClientFile(f); return; }
    const cp=e.target.closest("[data-cplanpdf]"); if(cp){ const p=(S.myPlans||[]).find(x=>x.id===cp.dataset.cplanpdf); if(!p) return; const nm=S.myRec?.intake?.fullName||S.myRec?.qest?.fullName||S.myRec?.followup?.fullName||S.myRec?.name||"";
      cp.disabled=true; cp.textContent="Making PDF…"; try{ saveBlob(await planPdf(p, nm), `Treatment plan${nm?" - "+nm:""} - ${p.date||today()}.pdf`); }catch(e1){ toast("Couldn't make the PDF. Check your connection and try again."); } cp.disabled=false; cp.textContent="Download PDF"; return; }
    const wb=e.target.closest("[data-who]"); if(wb){ if(wb.dataset.who!==S.who){ S.cviewAuto=true; S.cview="home"; S.form="qest"; watchPerson(wb.dataset.who); window.scrollTo(0,0); } return; }
    const c2=e.target.closest("[data-cv2]"); if(c2){ S.cview=c2.dataset.cv2; renderClient(); window.scrollTo(0,0); return; }
    const cc=e.target.closest("[data-ccal]"); if(cc){ const p=(S.myPlans||[]).find(x=>x.id===cc.dataset.ccal); if(p) doseCalendar(p, personName(S.who)||""); return; }
    const cpy=e.target.closest("[data-cpay]"); if(cpy){ const lbl=cpy.textContent; cpy.disabled=true; cpy.textContent="Opening secure checkout…"; const url=await squarePayLink(cpy.dataset.cpay);
      if(url){ location.href=url; return; } const v=(S.myInv||[]).find(x=>x.id===cpy.dataset.cpay); const fallback=(v?.pay||{}).payLink; cpy.disabled=false; cpy.textContent=lbl; if(fallback){ toast("Opening the payment page. Please enter the invoice amount."); window.open(fallback,"_blank"); } else toast("Online payment isn't available right now. Please text Dawn."); return; }
    const cpi=e.target.closest("[data-cinvprint]"); if(cpi){ const v=(S.myInv||[]).find(x=>x.id===cpi.dataset.cinvprint); if(v) invPrint(v, personName(S.who)||S.myRec?.name||""); return; }
    const ic=e.target.closest("[data-ics]"); if(ic){ const a=apptsOf(S.myRec).find(x=>x.id===ic.dataset.ics); if(a) apptIcs(a); return; }
    const rq=e.target.closest("[data-resched]"); if(rq){ S.reschedFor=rq.dataset.resched; renderClient(); $("#resched-note")?.focus(); return; }
    const dz=e.target.closest("[data-dash]"); if(dz){ S.cview="forms"; if(dz.dataset.dash==="form-homeo"){ S.form="homeo"; } else { S.form="qest"; if(S.myRec?.qestStatus==="submitted"){ S.qestNew=true; } } renderClient(); window.scrollTo(0,0); return; }
    const fm=e.target.closest("[data-form]"); if(fm){ S.form=fm.dataset.form; renderClient(); return; }
    const a=e.target.closest("[data-act]"); if(!a) return;
    const act=a.dataset.act;
    if(act==="reschedcancel"){ S.reschedFor=null; renderClient(); return; }
    if(act==="reschedsend"){ const a=apptsOf(S.myRec).find(x=>x.id===S.reschedFor); const note=($("#resched-note")?.value||"").trim(); if(!a) return;
      const body=`Date change request: my ${apptLabel(a).toLowerCase()} on ${apptWhen(a,true)}.${note?"\n\n"+note:""}`;
      if(await sendMsg(S.who, "client", body)){ try{ await S.db.doc("clients/"+S.who).update({reschedReq:{appt:a.id, at:new Date().toISOString()}}); }catch(e1){ console.warn(e1); }
        S.reschedFor=null; toast("Sent to Dawn. She'll get back to you."); renderClient(); } return; }
    if(act==="cmsgsend"){ const box=$("#cmsg-box"); a.disabled=true; if(await sendMsg(S.who, "client", box.value)){ S.cmsgDraft=""; box.value=""; box.blur(); toast("Sent to Dawn"); renderClient(); } a.disabled=false; return; }
    if(act==="csetpw"){ const v=$("#cpw-new")?.value||""; if(v.length<8){ toast("Please use at least 8 characters"); return; }
      a.disabled=true; const { error } = await SB.auth.updateUser({ password:v }); a.disabled=false;
      if(error){ console.warn(error); toast(/different from the old/i.test(error.message||"") ? "That's already your password" : "The password didn't save. Please try again."); return; }
      $("#cpw-new").value=""; store("wfw.signin","password"); S.pwOpen=false; toast("Password saved. Next time, choose “Use a password” to sign in."); renderClient(); return; }
    if(act==="qnew"){ S.qestNew=true; S.qestEdit=false; renderClient(); window.scrollTo(0,0); return; }
    if(act==="qedit"){ S.qestEdit=true; renderClient(); window.scrollTo(0,0); return; }
    if(act==="qeditcancel"){ S.qestEdit=false; renderClient(); window.scrollTo(0,0); return; }
    if(act==="famopen"){ S.famAdd=true; renderClient(); return; }
    if(act==="famcancel"){ S.famAdd=false; renderClient(); return; }
    if(act==="famadd"){ const nm=($("#fam-name")?.value||"").trim(); if(!nm){ toast("Please type their name"); return; }
      a.disabled=true; const id=S.me+"~"+genId(); const now=new Date().toISOString();
      try{ await S.db.doc("clients/"+id).set({name:nm, email:S.myEmail, createdAt:now, source:"portal-family"});
        S.family={...S.family, [id]:{name:nm, email:S.myEmail}}; S.famAdd=false; S.cviewAuto=false; S.cview="forms"; S.form="qest"; watchPerson(id); toast(`Added ${nm}. Fill in their form when you're ready.`); window.scrollTo(0,0);
      }catch(err){ console.warn(err); a.disabled=false; toast("That didn't save. Check your connection and try again."); }
      return; }
    if(!["cdraft","csubmit","qdraft","qsubmit","fdraft","fsubmit"].includes(act)) return;
    const isQ = act[0]==="q", isF = act[0]==="f", submit = act.endsWith("submit");
    const def = isQ ? QEST : isF ? FOLLOWUP : INTAKE, pre = isQ ? "cs" : isF ? "cf" : "ci";
    const vals = readIntake(pre, def);
    if(submit){
      const miss = def.flatMap(s=>s.fields).filter(f=>f.req && !vals[f.id]);
      if(isQ) vals.photoOnFile = !!document.getElementById("cs-photoOnFile")?.checked || undefined;
      if(isQ && !S.myPhoto && !vals.photoOnFile){ toast("Please add a recent photo of the person being scanned, or tick the box to use the photo on file"); document.querySelector('label[for="cp-photo"]')?.scrollIntoView({block:"center"}); return; }
      if(miss.length){ const m0=miss[0]; if(m0.type==="choice"){ toast(`Please answer: ${m0.label}`); document.getElementById(`${pre}-${m0.id}-0`)?.scrollIntoView({block:"center"}); return; } }
      if(isQ && !miss.length && vals.delivery===IMPRINT_REMOTE && (!S.myImprint || imprintStale())){ toast(S.myImprint ? "Please upload a picture of the medium you've prepared for this scan" : "Please upload a picture of your prepared remote imprint medium"); document.getElementById("cs-imprintbox")?.scrollIntoView({block:"center"}); return; }
      if(isQ && !miss.length && vals.delivery==="Shipped to me"){ const need=(vals.shipDifferent ? [["shipStreet","shipping address"],["shipCity","shipping city"],["shipZip","shipping ZIP code"]] : [["street","street address"],["city","city"],["zip","ZIP code"]]).filter(([k])=>!vals[k]); if(need.length){ toast(`To ship your treatment, please fill in your ${need.map(x=>x[1]).join(", ")}`); document.getElementById("cs-"+need[0][0])?.focus(); document.getElementById("cs-"+need[0][0])?.scrollIntoView({block:"center"}); return; } }
      if(miss.length){ toast(miss.some(f=>f.type==="check") ? "Please check the acknowledgement and sign at the end" : `Please fill in: ${miss.map(f=>f.label).join(", ")}`); const el=document.getElementById(pre+"-"+miss[0].id); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } return; }
    }
    if(isQ && vals.delivery===IMPRINT_REMOTE && S.myImprint && !imprintStale()) vals.imprintPic = `Uploaded ${fmtDate(S.myImprintAt)}`;
    a.disabled=true;
    const now=new Date().toISOString();
    const key = isQ ? "qest" : isF ? "followup" : "intake", stKey = key + "Status";
    let patch = {[key]:vals, [stKey]: submit ? "submitted" : (S.myRec?.[stKey]==="submitted" ? "submitted" : "draft"), [key+"UpdatedAt"]:now};
    if(isQ && !submit && S.myRec?.qestStatus==="submitted") patch = {qestDraft:vals, qestUpdatedAt:now};
    const editing = isQ && submit && S.qestEdit && S.myRec?.qestStatus==="submitted";
    if(isQ && submit && !editing){ patch.qestDraft = null; S.qestNew = false; }
    if(editing) patch.qestEditedAt = now;
    if(isF && submit) patch.followup = {fullName: vals.fullName||""};
    if(submit) patch[key+"SubmittedAt"] = now;
    if(isQ && submit && !editing && !(S.myRec?.appointments||[]).some(a=>a.type==="scan" && a.date>=today()) && !S.myRec?.scanToSchedule){
      const by=new Date(); by.setDate(by.getDate()+7); patch.scanToSchedule = {orderedAt:today(), by:by.toISOString().slice(0,10), source:"form", delivery: vals.delivery==="Shipped to me"?"ship":vals.delivery?"imprint":"", zoom: /^yes/i.test(vals.zoomThis||"") ? "yes" : vals.zoomThis ? "no" : ""}; }
    if(isF && submit) patch.followupHistory = [...(S.myRec?.followupHistory||[]), {form:vals, submittedAt:now}].slice(-60);
    try{
      const who=S.who||S.me;
      if(S.myRec) await S.db.doc("clients/"+who).update(patch);
      else await S.db.doc("clients/"+who).set({...patch, email:S.myEmail, createdAt:now, source:"portal"});
      if(editing){
        // replace the form in this scan's history instead of adding a second one
        const hist = await S.db.collection(`clients/${who}/qestForms`).get();
        const last = hist.docs.map(d=>({id:d.id, ...d.data()})).sort((x,y)=>(y.submittedAt||"").localeCompare(x.submittedAt||""))[0];
        if(last) await S.db.doc(`clients/${who}/qestForms/${last.id}`).set({form:vals, submittedAt:now, editedFrom:last.submittedAt||""});
        else await S.db.collection(`clients/${who}/qestForms`).doc().set({form:vals, submittedAt:now});
        S.qestEdit=false;
      }
      else if(isQ && submit) await S.db.collection(`clients/${who}/qestForms`).doc().set({form:vals, submittedAt:now});
      S.myRec = {...(S.myRec||{}), ...patch}; if(S.myRec.qestDraft===null) delete S.myRec.qestDraft;
      S.clientWrite="ok"; toast(editing?"Your changes were sent to Dawn. Thank you!":submit?"Sent to Dawn. Thank you!":"Saved");
      if(submit) S.cview="plans";
      renderClient(); window.scrollTo(0,0);
    }catch(err){ console.warn(err); a.disabled=false; if(err?.code==="invalid_argument"){ S.clientWrite="denied"; renderClient(); window.scrollTo(0,0); } else toast("That didn't save. Check your connection and try again."); }
  };
}
/* ---------- printable dose calendar from a treatment plan ---------- */
function freqRule(f){ const t=String(f||"").replace(/\s+/g,""); let m;
  if((m=t.match(/^(\d)D$/i))) return {every:1, times:+m[1]};
  if(/^eOD$/i.test(t)||/^eOtherNight$/i.test(t)) return {every:2, times:1, night:/Night/i.test(t)};
  if((m=t.match(/^e(\d+)D$/i))) return {every:+m[1], times:1};
  if(/^1W$/i.test(t)) return {every:7, times:1};
  if((m=t.match(/^e(\d+)W$/i))) return {every:7*+m[1], times:1};
  if((m=t.match(/^e(\d+)(H|min|m)$/i))) return {every:1, times:1, note:plainFreq(f)};
  if(/^SOS$/i.test(t)) return null;
  const pf=String(f||"").toLowerCase(); if(/twice|2x/.test(pf)) return {every:1,times:2}; if(/three|3x/.test(pf)) return {every:1,times:3}; if(/daily|once a day/.test(pf)) return {every:1,times:1}; if(/other day/.test(pf)) return {every:2,times:1}; if(/week/.test(pf)) return {every:7,times:1};
  return null; }
function durDays(d){ const s=String(d||"").toLowerCase(); let m; if((m=s.match(/(\d+)\s*week/))) return 7*+m[1]; if((m=s.match(/(\d+)\s*month/))) return 30*+m[1]; if((m=s.match(/(\d+)\s*day/))) return +m[1]; return 0; }
function doseCalendar(p, who){
  const items=displayItems(p); if(!items.length) return;
  const w=window.open("","_blank"); if(!w){ toast("Allow pop-ups to open the dose calendar"); return; }
  const start=new Date(today()+"T12:00:00"); const pd=p.date?new Date(p.date+"T12:00:00"):null; if(pd && (start-pd)/864e5<=10 && pd<=start) start.setTime(pd.getTime());
  const days=Math.min(56, Math.max(28, ...items.map(b=>durDays(b.duration)||28)));
  const rows=items.map(b=>({b, r:freqRule(b.freq)}));
  const weeks=[]; for(let i=0;i<days;i+=7) weeks.push([...Array(Math.min(7,days-i)).keys()].map(k=>{ const d=new Date(start); d.setDate(d.getDate()+i+k); return {d, n:i+k}; }));
  const name=b=>`${b._label}${b.issue?" · "+b.issue:""}`;
  const box=(r,n,b)=>{ const lim=durDays(b.duration); if(!r || (lim && n>=lim) || n%r.every) return ""; return "☐ ".repeat(r.times).trim(); };
  const esc2=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Dose calendar</title><style>
    body{font:13px/1.4 Georgia,serif;color:#222;margin:28px} h1{font-weight:normal;color:#087C9C;margin:0} .muted{color:#777}
    table{width:100%;border-collapse:collapse;margin:14px 0;page-break-inside:avoid} th,td{border:1px solid #ccc;padding:6px;text-align:center;vertical-align:top} th:first-child,td:first-child{text-align:left;width:30%} td{font-size:16px} th{font-weight:normal;font-size:12px;background:#f3f9fa}
    .key{font-size:12px} @media print{body{margin:12px}}</style></head><body>
    <h1>Dose calendar</h1><div class="muted">${esc2(who||"")}${who?" · ":""}Treatment plan from ${esc2(fmtDate(p.date||today()))} · starting ${esc2(fmtDate(start.toISOString().slice(0,10)))}</div>
    <p class="key">Tick a box ☐ each time you take a dose.${rows.some(x=>!x.r)?" Remedies marked “as needed” have no boxes: take them only when you need them.":""}</p>
    ${weeks.map((wk,i)=>`<table><tr><th>Week ${i+1}</th>${wk.map(x=>`<th>${x.d.toLocaleDateString(undefined,{weekday:"short"})}<br>${x.d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</th>`).join("")}</tr>
      ${rows.map(({b,r})=>`<tr><td>${esc2(name(b))}<br><span class="muted" style="font-size:11px">${esc2(r?(r.note||plainFreq(b.freq)||b.freq||""):"as needed")}</span></td>${wk.map(x=>`<td>${box(r,x.n,b)}</td>`).join("")}</tr>`).join("")}</table>`).join("")}
    ${cleanInstr(p.instructions)?`<p class="key"><b>How to take your remedies:</b> ${esc2(cleanInstr(p.instructions))}</p>`:""}
    <p class="muted key">Dawn Spain, PHom · Wellness From Within · ${esc2(PRACTICE.phone)}</p>
    <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}
function planCard(p){
  return `<article class="sheet planview">
    <div class="row" style="align-items:flex-start"><div class="grow"><p class="label">${esc(fmtDate(p.date))}</p><h2>${esc(!p.title||/^remedy plan$/i.test(p.title)?"Treatment plan":p.title)}</h2></div><div class="row" style="gap:6px"><button type="button" data-cplanpdf="${esc(p.id||"")}">Download PDF</button><button type="button" class="ghost" data-ccal="${esc(p.id||"")}">Dose calendar</button></div></div>
    ${(()=>{ const gs=displayGroups(p); return gs.map(g=>`${gs.length>1?`<h3 style="margin-top:4px">${esc(g.title)}</h3>`:g.form==="pellets"?`<p class="small muted" style="margin:0">Your remedies are pellets.</p>`:g.form==="tt1"?`<p class="small muted" style="margin:0">TT-1</p>`:""}`+g.items.map(b=>`<div class="bottle">
      <div class="bottle-head"><span class="bottle-num">${esc(b._label)}</span><h3 class="grow">${esc(b.issue||"")}</h3></div>
      ${b.remedies?`<ul class="rxlist">${remedyLines(b.remedies).map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
      <div class="grid2">
        ${b.freq?`<div><p class="label">How often</p><p class="freq">${esc(plainFreq(b.freq)||b.freq)}${plainFreq(b.freq)?` <span class="mono muted">${esc(b.freq)}</span>`:""}</p></div>`:""}
        ${b.duration?`<div><p class="label">How long</p><p>${esc(b.duration)}</p></div>`:""}
      </div>
      ${b.notes?`<p class="small">${esc(b.notes)}</p>`:""}
    </div>`).join("")).join(""); })()}
    ${(p.extra||"").trim()?`<div><p class="label">Also recommended</p><p style="white-space:pre-wrap">${esc(p.extra.trim())}</p></div>`:""}
    ${cleanInstr(p.instructions)?`<div><p class="label">How to take your remedies</p><p style="white-space:pre-wrap">${esc(cleanInstr(p.instructions))}</p></div>`:""}
  </article>`;
}
function contactBlock(){
  return `<div class="contact"><span>${esc(PRACTICE.name)}</span><span>${esc(PRACTICE.phone)}</span><span>${esc(PRACTICE.email)}</span><a href="https://${PRACTICE.site}" target="_blank" rel="noopener">${esc(PRACTICE.site)}</a></div>`;
}
